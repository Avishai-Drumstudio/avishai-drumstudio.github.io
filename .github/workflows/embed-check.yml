name: embed check
on:
  push:
    paths: ['.github/embed-check.txt']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p .data; : > .data/embed.txt
          for i in $(cat .github/embed-check.txt); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$i&format=json")
            echo "$i $code" >> .data/embed.txt
          done
          cat .data/embed.txt
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add .data; git commit -m "Embed check" || exit 0; git push
