name: fetch own videos
on:
  workflow_dispatch:
  push:
    paths: ['.github/fetch-own-videos.txt']
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -U yt-dlp && sudo apt-get -qq install -y ffmpeg >/dev/null
      - name: download Avishai's own intro + studio videos
        run: |
          mkdir -p .data/yt
          for id in SMZbWh5Qp8A acj-V-isUmU; do
            yt-dlp --ignore-errors -f "bv*[height<=1080][ext=mp4]+ba[ext=m4a]/b[ext=mp4]/b" --merge-output-format mp4 \
              -o ".data/yt/$id.%(ext)s" "https://www.youtube.com/watch?v=$id" >> .data/yt/log.txt 2>&1 || true
          done
          ls -la .data/yt >> .data/yt/log.txt
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add .data; git commit -m "Own videos fetched" || exit 0; git push
