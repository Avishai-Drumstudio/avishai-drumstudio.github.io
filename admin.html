<style>
:root{
  --bg:#0F1716; --surface:#16211F; --surface-2:#1E2B28; --field:#0B1210;
  --line:rgba(225,214,190,.11); --text:#EDE4D3; --muted:#A39E90;
  --lime:#2ED3C3;
  --sand:#E3D3B6; --on-lime:#0C1A18; --danger:#FF8A7A;
  --font:"Heebo","Assistant",Arial,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100svh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:8px}
.wrap{max-width:820px;margin-inline:auto;padding-inline:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;font-weight:700;font-size:15px}
.btn--lime{background:var(--lime);color:var(--on-lime)}
.btn--lime:disabled{opacity:.5;cursor:default}
.btn--soft{background:var(--surface-2)}
.btn--line{border:1.5px solid var(--line)}
.btn--sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px;font-weight:500}
.logo{position:relative;width:42px;height:42px;border-radius:50%;background:radial-gradient(120% 120% at 30% 20%,#25332F,#0B1110 70%);display:grid;place-items:center;font-weight:900;font-style:italic;letter-spacing:-.06em;color:var(--sand);direction:ltr;flex:none;box-shadow:0 0 0 2px var(--lime),0 6px 16px rgba(0,0,0,.4)}

/* login */
.login{min-height:100svh;display:grid;place-items:center;padding:16px}
.login__box{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 22px;display:grid;gap:16px}
.login h1{font-size:1.5rem;font-weight:800}
.login p{color:var(--muted);font-size:15px}
.err{color:var(--danger);font-size:14px;min-height:1.2em}

/* fields */
label.f{display:grid;gap:6px;font-size:14px;color:var(--muted);font-weight:500}
input[type=text],input[type=url],input[type=password],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text);font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--lime);outline:none}
textarea{min-height:84px;resize:vertical;line-height:1.5}
input[dir=ltr]{text-align:left}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}

/* layout */
.bar{position:sticky;top:0;z-index:20;background:rgba(15,23,22,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar__in{display:flex;align-items:center;gap:12px;min-height:64px}
.bar__title{font-weight:800;flex:1}
.bar__title small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:38px;padding:0 14px;border-radius:10px;background:var(--surface);color:var(--muted);font-size:14.5px;font-weight:500}
.tab[aria-selected=true]{background:var(--lime);color:var(--on-lime)}
.panel{padding-block:20px 140px;display:grid;gap:14px}
.panel,.card,.panel-list{grid-template-columns:minmax(0,1fr)}
.panel > *,.card > *{min-width:0}
.card__head{flex-wrap:wrap}
.card__head b{flex:1 1 140px}
.panel h2{font-size:1.25rem;font-weight:800}
.panel > p{color:var(--muted);font-size:14.5px;margin-top:-6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.card.is-off{opacity:.55}
.card__head{display:flex;align-items:center;gap:8px}
.card__head b{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn svg{width:16px;height:16px}
.icon-btn.danger{color:var(--danger)}
.icon-btn.confirm{background:var(--danger);color:#1a0b08;width:auto;padding:0 10px;font-size:13px;font-weight:700}
.grid2{display:grid;gap:12px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;flex:none}
.toggle input{appearance:none;width:42px;height:24px;border-radius:999px;background:var(--surface-2);position:relative;cursor:pointer;transition:background .2s;border:1px solid var(--line)}
.toggle input::after{content:"";position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.toggle input:checked{background:rgba(46,211,195,.25)}
.toggle input:checked::after{transform:translateX(-18px);background:var(--lime)}
.add{border:1.5px dashed var(--line);border-radius:16px;min-height:54px;color:var(--lime);font-weight:700}

.savebar{position:fixed;bottom:0;inset-inline:0;z-index:20;background:rgba(15,23,22,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar__in{display:flex;align-items:center;gap:12px;min-height:72px}
.status{flex:1;font-size:14px;color:var(--muted)}
.status.dirty{color:var(--lime)}
.status.bad{color:var(--danger)}
.notice{background:rgba(255,138,122,.1);border:1px solid rgba(255,138,122,.3);color:#FFD1C9;border-radius:14px;padding:14px 16px;font-size:14.5px}
.up{display:grid;gap:10px;margin-top:12px}
.up__btn{width:100%;justify-content:center}
.up__bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.up__bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2ED3C3,#7FE7DC);transition:width .3s}
.up__prev{width:100%;border-radius:14px;background:#000;max-height:260px}
details.card summary{cursor:pointer;font-weight:700;padding:4px 0}
details.card[open] summary{margin-bottom:10px}
</style>
</head>

<!-- ============ LOGIN ============ -->
<section class="login" id="login">
  <form class="login__box" id="loginForm" autocomplete="on">
    <span class="logo">AY</span>
    <h1>כניסת ניהול</h1>
    <p>מכאן משנים את הטקסטים, הקישורים והסדר של האתר.</p>
    <div class="notice" id="noApi" hidden>שירות השמירה עוד לא מחובר, ולכן אי אפשר להיכנס מכאן. בכתובת שגוגל נותן לאתר הכניסה עובדת.</div>
    <input type="text" name="username" autocomplete="username" value="AY Admin" readonly tabindex="-1" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
    <label class="f">סיסמה
      <input type="password" id="pw" name="password" autocomplete="current-password" required>
      <span class="hint">באייפון: שמרו את הסיסמה כשמוצע, ובפעם הבאה היא תמולא עם Face ID</span>
    </label>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn btn--soft" type="button" id="demoBtn" hidden>לראות את מסך הניהול (תצוגה בלבד)</button>
    <button class="btn btn--lime" type="submit" id="loginBtn">כניסה</button>
    <a href="index.html" class="hint" style="text-align:center">חזרה לאתר</a>
  </form>
</section>

<!-- ============ EDITOR ============ -->
<div id="editor" hidden>
  <header class="bar">
    <div class="wrap">
      <div class="bar__in">
        <span class="logo">AY</span>
        <div class="bar__title">ניהול האתר<small>אבישי ישר</small></div>
        <a class="btn btn--soft btn--sm" href="index.html" target="_blank" rel="noopener">לצפייה באתר</a>
        <button class="btn btn--line btn--sm" type="button" id="logout">יציאה</button>
      </div>
      <nav class="tabs" id="tabs" role="tablist"></nav>
    </div>
  </header>
  <main class="wrap" id="panels"></main>
  <footer class="savebar">
    <div class="wrap savebar__in">
      <span class="status" id="status" role="status">אין שינויים</span>
      <button class="btn btn--lime" type="button" id="save" disabled>שמירה</button>
    </div>
  </footer>
</div>

/* merges saved content over the defaults, so new fields always have a value */
window.mergeContent = function (saved) {
  const d = JSON.parse(JSON.stringify(window.SITE_DEFAULTS));
  if (!saved || typeof saved !== "object") return d;
  Object.keys(saved).forEach(k => {
    if (k === "show") d.show = Object.assign(d.show, saved.show || {});
    else if (saved[k] !== undefined && saved[k] !== null) d[k] = saved[k];
  });
  // older saved content still pointing at the first photos / no background video
  const OLD = "https://base44.app/api/apps/6a777cb7cc015cd93baf4efa/files/mp/public/6a777cb7cc015cd93baf4efa/da3fa96a8_IMG_8136.jpeg";
  if (d.heroImage === OLD) d.heroImage = window.SITE_DEFAULTS.heroImage;
  if (d.aboutImage === OLD) d.aboutImage = window.SITE_DEFAULTS.aboutImage;
  // fix two mistyped YouTube links (l / I mixed up)
  const FIX = { mvlhYC6DV9A: "mvIhYC6DV9A", i3dohIGVZD4: "i3dohlGVZD4" };
  (d.productions || []).forEach(p => { if (p && p.url) Object.keys(FIX).forEach(b => { p.url = String(p.url).replace(b, FIX[b]); }); });
  if (!String(d.bgVideo || "").trim()) d.bgVideo = window.SITE_DEFAULTS.bgVideo;
  const all = window.SITE_DEFAULTS.order.concat((d.custom || []).filter(c => c && c.id).map(c => "c_" + c.id));
  d.order = (d.order || []).filter(k => all.includes(k));
  all.forEach((k, i) => { if (d.order.includes(k)) return;
    const prev = all.slice(0, i).reverse().find(x => d.order.includes(x)); // new sections land next to their default neighbour
    prev ? d.order.splice(d.order.indexOf(prev) + 1, 0, k) : d.order.unshift(k); });
  return d;
};

  function videoUploader(item, grid){

      const CH = 6 * 1024 * 1024, uid = "ay" + Date.now(), url = `https://api.cloudinary.com/v1_1/${encodeURIComponent(S.cloudName.trim())}/video/upload`;
      try{
        let res = null;
        for(let start = 0; start < f.size; start += CH){
          const end = Math.min(start + CH, f.size), fd = new FormData();
          fd.append("file", f.slice(start, end), f.name || "cover.mp4"); fd.append("upload_preset", S.cloudPreset.trim()); fd.append("folder", "ay-covers");
          const r = await fetch(url, { method:"POST", body:fd, ...(f.size > CH ? { headers:{ "X-Unique-Upload-Id": uid, "Content-Range": `bytes ${start}-${end-1}/${f.size}` } } : {}) });
          res = await r.json().catch(() => ({}));
          if(!r.ok) throw new Error((res.error && res.error.message) || ("שגיאה " + r.status));
          bar.style.width = Math.round(end / f.size * 100) + "%";

        if(!res || !res.secure_url) throw new Error("ההעלאה לא הושלמה");

    });
    show();
    return el("div", {class:"up"}, btn, inp, prog, msg, prev);

        }); };
      draw();
      return [el("h2", {}, "סדר הסקציות"), el("p", {}, "החלק העליון עם הכותרת והווידאו תמיד ראשון. את כל השאר מסדרים כאן, ומסתירים מה שלא צריך."), box];
    }},
    { name:"חלקים נוספים", build: () => [
      el("h2", {}, "חלקים נוספים"),
      el("p", {}, "כאן מוסיפים לאתר חלק חדש משלכם: כותרת, טקסט, תמונה וכפתור. אחרי ההוספה, בלשונית \"סדר הדף\" קובעים איפה הוא יופיע ואם הוא מוצג."),
      listEditor(S.custom, { title:x => x.title, noShow:true,
        fields:[["eyebrow","שורה קטנה מעל הכותרת"],["title","כותרת"],["navTitle","שם בתפריט (לא חובה)"],["text","טקסט","textarea","כדי להתחיל פסקה חדשה משאירים שורה ריקה"],["image","קישור לתמונה (לא חובה)","url"],["btnText","טקסט על הכפתור (לא חובה)"],["btnUrl","לאן הכפתור מוביל (לא חובה)","url"]],
        blank:() => ({ id: Date.now().toString(36), eyebrow:"", title:"", navTitle:"", text:"", image:"", btnText:"", btnUrl:"" }), addLabel:"הוספת חלק חדש" })
    ]},
    { name:"הפקות", build: () => [
      el("h2", {}, "הפקות"), el("p", {}, "כל פריט הוא סרטון יוטיוב. הסדר כאן הוא הסדר באתר, גם בגלילה לצדדים וגם ברשת."),
      listEditor(S.productions, { title:x => x.title, fields:[["url","קישור יוטיוב","url"],["title","שם השיר"]], blank:() => ({url:"",title:"",show:true}), addLabel:"הוספת הפקה" })
    ]},
    { name:"קאברים", build: () => [
      el("h2", {}, "קאברים בסגנונות שונים"), el("p", {}, "3–4 סרטוני יוטיוב, כל אחד בסגנון אחר. החלק מופיע באתר רק כשיש לפחות קאבר אחד."),
      el("div", {class:"card"}, field(S,"hCovers","כותרת החלק"), field(S,"pCovers","שורה מתחת לכותרת")),
      listEditor(S.covers, { title:x => [x.style, x.title].filter(Boolean).join(" · "), fields:[["style","סגנון (למשל: רוק, פאנק, חסידי, ים-תיכוני)"],["title","שם השיר (לא חובה)"],["url","סרטון (מתמלא לבד אחרי העלאה, או קישור יוטיוב)","url"]], blank:() => ({url:"",style:"",title:"",poster:"",show:true}), addLabel:"הוספת קאבר", extra: videoUploader }),
      el("details", {class:"card"}, el("summary", {}, "הגדרות העלאת סרטונים (פעם אחת)"),
        field(S,"cloudName","Cloud name","url","מהחשבון ב-Cloudinary"),
        field(S,"cloudPreset","Upload preset","url","שם ה-preset מסוג Unsigned"))
    ]},
    { name:"סורסים", build: () => [
      el("h2", {}, "סורסים"), el("p", {}, "קישור לתופים בלבד מפעיל את הנגן. כשיש גם קישור להפקה המלאה, מופיע סליידר שעובר בין התופים לבד להפקה המלאה. שני הקבצים צריכים להתחיל באותה נקודה ובאותו אורך."),
      listEditor(S.sources, { title:x => x.name, fields:[["name","שם השיר"],["audio","קישור MP3 – רק תופים","url"],["mix","קישור MP3 – ההפקה המלאה (לסליידר)","url"],["drive","קישור לערוצים המלאים","url"]], blank:() => ({name:"",audio:"",mix:"",drive:"",show:true}), addLabel:"הוספת סורס" })
    ]},
    { name:"ציוד", build: () => {
      const catNames = () => [...new Set([...S.gearCats.map(c => c.name).filter(Boolean), ...S.gear.map(g => g.category).filter(Boolean)])];
      // categories: add, rename, reorder, hide
      const catBox = el("div", {style:"display:grid;gap:10px"});
      const drawCats = () => { catBox.innerHTML = "";
        S.gearCats.forEach((c,i) => {
          const count = S.gear.filter(g => g.category === c.name).length;
          const name = el("input", {type:"text", value:c.name || "", "aria-label":"שם הקטגוריה"});
          let prev = c.name;
          name.addEventListener("input", () => { c.name = name.value; markDirty(); });
          name.addEventListener("change", () => { S.gear.forEach(g => { if(g.category === prev) g.category = c.name; }); prev = c.name; markDirty(); setTimeout(() => { if(PANELS[current].name === "ציוד") show(current); }, 0); });
          const up = iconBtn("up","למעלה", () => { [S.gearCats[i-1],S.gearCats[i]] = [S.gearCats[i],S.gearCats[i-1]]; markDirty(); drawCats(); }); up.disabled = i === 0;
          const dn = iconBtn("down","למטה", () => { [S.gearCats[i+1],S.gearCats[i]] = [S.gearCats[i],S.gearCats[i+1]]; markDirty(); drawCats(); }); dn.disabled = i === S.gearCats.length - 1;
          const del = iconBtn("trash","מחיקה", () => {
            if(count){ alert("בקטגוריה יש " + count + " פריטים. קודם מעבירים אותם לקטגוריה אחרת או מוחקים אותם."); return; }
            S.gearCats.splice(i,1); markDirty(); show(current); }, "danger");
          const card = el("div", {class:"card" + (c.show === false ? " is-off" : "")},
            el("div", {class:"card__head"}, el("b", {}, count + " פריטים"), toggle(c, "show", "מוצג", on => card.classList.toggle("is-off", !on)), up, dn, del),
            name);
          catBox.append(card);
        });
        catBox.append(el("button", {type:"button", class:"add", onclick:() => { S.gearCats.push({name:"קטגוריה חדשה", show:true}); markDirty(); show(current); }}, "+ הוספת קטגוריה"));
      };
      drawCats();
      return [
        el("h2", {}, "קטגוריות ציוד"), el("p", {}, "הסדר כאן הוא הסדר באתר. שינוי שם מעדכן את כל הפריטים שבקטגוריה."), catBox,
        el("h2", {}, "פריטי ציוד"), el("p", {}, "בוחרים לכל פריט קטגוריה. קישור ריק = בלי כפתור למוצר."),
        listEditor(S.gear, { title:x => x.name, fields:[["category","קטגוריה","select",catNames()],["role","תפקיד (למשל Kick In)"],["name","שם הפריט"],["img","קישור לתמונה","url"],["url","קישור למוצר","url"]], blank:() => ({category:(S.gearCats[0]||{}).name||"",role:"",name:"",img:"",url:"",show:true}), addLabel:"הוספת פריט" })
      ];
    }},
    { name:"המלצות", build: () => [
      el("h2", {}, "המלצות"), el("p", {}, "הסקציה מופיעה באתר כשיש לפחות המלצה אחת מוצגת."),
      listEditor(S.testimonials, { title:x => x.name, fields:[["name","שם"],["role","תפקיד / על מה עבדנו"],["text","ההמלצה","textarea"]], blank:() => ({name:"",role:"",text:"",show:true}), addLabel:"הוספת המלצה" })
    ]}
  ];

  const secName = k => SECTION_NAMES[k] || (k.startsWith("c_") ? "חלק נוסף: " + (((S.custom || []).find(c => "c_" + c.id === k) || {}).title || "בלי כותרת") : k);
  // keep the page order in step with added / deleted custom sections
  function syncOrder(){
    S.custom = S.custom || []; S.gearCats = S.gearCats || [];
    const keys = S.custom.filter(c => c && c.id).map(c => "c_" + c.id);
    S.order = S.order.filter(k => !k.startsWith("c_") || keys.includes(k));
    keys.forEach(k => { if(!S.order.includes(k)){ const at = S.order.indexOf("cta"); at < 0 ? S.order.push(k) : S.order.splice(at, 0, k); } });
  }

  function buildTabs(){
    $("#tabs").innerHTML = "";
    PANELS.forEach((p,i) => $("#tabs").append(el("button", {type:"button", class:"tab", role:"tab", "aria-selected": String(i===current), onclick:() => show(i)}, p.name)));
  }
  function show(i){
    current = i; syncOrder();
    [...$("#tabs").children].forEach((t,j) => t.setAttribute("aria-selected", String(i===j)));
    const panel = el("section", {class:"panel"}, PANELS[i].build());
    $("#panels").replaceChildren(panel);
    scrollTo({top:0});
  }
})();
</script>
</body>
</html>
