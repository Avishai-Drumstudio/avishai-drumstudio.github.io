<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Studio Manager – בדיקת כניסה</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d0b09;color:#fff;font-family:Rubik,system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
.card{max-width:380px;width:100%}
h1{font-size:24px;margin:0 0 8px}
p{opacity:.85;line-height:1.5}
button{border:0;border-radius:999px;padding:14px 26px;font:700 16px Rubik,system-ui,sans-serif;background:#fff;color:#222;cursor:pointer}
#st{margin-top:18px;font-size:16px;min-height:1.5em}
#dbg{margin-top:18px;font-size:12px;opacity:.6;direction:ltr}
.ok{color:#86efac}.bad{color:#fda4af}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="../studio/firebase-config.js?v=6"></script>
</head>
<body>
<div class="card">
  <h1>בדיקת כניסה עם Google</h1>
  <p>עמוד בדיקה בלבד: הוא לא קורא ולא משנה שום נתון באפליקציה.</p>
  <button id="go">כניסה עם Google</button>
  <div id="st"></div>
  <div id="dbg"></div>
</div>
<script>
/* עותק בדיקה: כניסה בהפניה (redirect) דרך הדומיין שלנו (authDomain = avishai-drumstudio.github.io).
   אפליקציית Firebase בשם נפרד, כדי שהכניסה כאן לא תשפיע על הכניסה באפליקציה האמיתית. */
(function () {
  var st = document.getElementById('st'), dbg = document.getElementById('dbg');
  function show(t, c) { st.className = c || ''; st.textContent = t; }
  var cfg = Object.assign({}, window.FIREBASE_CONFIG, { authDomain: location.host });
  dbg.textContent = 'authDomain: ' + cfg.authDomain;
  var app = firebase.initializeApp(cfg, 'studio-login-test');
  var auth = app.auth();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function () {});
  fetch('/__/auth/handler', { cache: 'no-store' }).then(function (r) {
    if (!r.ok) show('קבצי הכניסה עוד לא עלו לאתר (' + r.status + '). נסה שוב בעוד דקה.', 'bad');
  }).catch(function () {});
  show('בודק…');
  auth.getRedirectResult().then(function (r) {
    if (r && r.user) show('✅ הכניסה עבדה: ' + r.user.email, 'ok');
  }).catch(function (e) { show('❌ הכניסה נכשלה: ' + (e && e.code || e), 'bad'); });
  auth.onAuthStateChanged(function (u) {
    if (u) show('✅ מחובר: ' + u.email, 'ok');
    else if (st.textContent === 'בודק…') show('לא מחובר. לחץ על הכפתור.');
  });
  document.getElementById('go').onclick = function () {
    var p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
    show('עובר לגוגל…');
    auth.signInWithRedirect(p).catch(function (e) { show('❌ ' + (e && e.code || e), 'bad'); });
  };
})();
</script>
</body>
</html>
