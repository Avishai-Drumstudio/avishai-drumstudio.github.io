                <button onClick=${() => doneSession(g, i)} className="rounded-full grad px-3 py-1 text-xs font-bold">✓ בוצע</button></li>`)}
              ${due.map(x => html`<li key=${x.id} className="flex items-center gap-2 text-sm"><span className="min-w-0 flex-1">${x.text}<span className="block text-xs text-muted">${x.date < t0 ? fmtDay(x.date) : 'היום'}${x.time ? ' · ' + x.time : ''}</span></span>
              <button onClick=${() => onTodo(x.id, 'done')} className="rounded-full grad px-3 py-1 text-xs font-bold">✓ בוצע</button></li>`)}</ul></div>`; })()}
          ${tab === 'calendar' && html`<${CalendarView} gigs=${gigs} subs=${subs} admin=${unlocked} gsyncUI=${gsyncUI} onOpen=${setOpenId} onAdd=${d => setEditing(blankGig(d))} />
            ${unlocked && html`<${QuickStats} gigs=${gigs} go=${setTab} />`}`}
          ${tab === 'list' && html`<${GigList} gigs=${gigs} subs=${subs} onOpen=${setOpenId} admin=${unlocked} />`}
          ${tab === 'clients' && html`<${Clients} book=${book} admin=${false} gigs=${gigs} clients=${clients} setClients=${setClients} onRename=${(o, n) => setGigs(l => l.map(g => sameName(g.client, o) ? Object.assign({}, g, { client: n }) : g))} onOpen=${setOpenId} />`}
          ${tab === 'subs' && html`<${Subs} book=${book} admin=${unlocked} subs=${subs} gigs=${gigs} setSubs=${setSubs} onOpen=${setOpenId} />`}
          ${unlocked && html`
          ${ADMIN_IDS.includes(tab) && html`<div className="scroll-x -mx-3 mb-4 px-3"><div className="flex gap-1.5 w-max mx-auto">
            ${TABS.filter(t => ADMIN_IDS.includes(t.id)).map(t => {
              const n = t.id === 'payments' ? overdueCount : t.id === 'tax' ? docCount : 0;
              return html`<button key=${t.id} onClick=${() => { setTab(t.id); window.scrollTo(0, 0); }} aria-current=${tab === t.id ? 'page' : undefined}
                className=${'flex items-center gap-1.5 whitespace-nowrap rounded-full px-3.5 py-2 text-sm font-semibold transition ' + (tab === t.id ? 'grad' : 'glass-soft text-muted hover:text-[var(--ink)]')}>
                <span aria-hidden="true">${t.subIcon || t.icon}</span>${t.sub || t.label}
                ${n > 0 && html`<span className="rounded-full bg-rose-500 px-1.5 text-[11px] leading-4 text-white">${n}</span>`}</button>`;
            })}
          </div></div>`}
          ${tab === 'admin' && html`<${AdminDashboard} gigs=${gigs} onOpen=${setOpenId} onPay=${setPayId} onLock=${lock} onFaceId=${enableFaceId} faceIdOn=${!!(data.admin && (data.admin.passkeys || []).length)} onChangePw=${() => setLogin('change')} go=${setTab} />`}
          ${tab === 'payments' && html`<${Payments} gigs=${gigs} onOpen=${setOpenId} onPay=${setPayId} onInvoice=${setInvId} update=${update} />`}
          ${tab === 'tax' && html`<${Tax} gigs=${gigs} update=${update} onUnpay=${undoPaid} onOpen=${setOpenId} onDoc=${(id, kind) => setDocReq({ id, kind })} onPay=${(id, kind) => { setPayPreset(kind); setPayId(id); }} exportCsv=${exportCsv} />`}
          ${tab === 'settings' && html`<${Settings} data=${data} book=${book} setBook=${setBook} gsync=${gsyncApi} freshData=${freshData} setConfig=${setConfig} renameType=${renameType} setData=${replaceData} mode=${mode} lastSync=${lastSync} theme=${theme} setTheme=${setTheme} backup=${backup} toast=${setToast} />`}`}`}
      </main>

      <nav aria-label="ניווט" className="fixed inset-x-0 bottom-0 z-40 px-2 sm:px-3" style=${{ paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 0.75rem)' }}>
        <div className="glass mx-auto flex max-w-md justify-between gap-0.5 rounded-[2rem] p-1.5">
          ${MAIN_TABS.map(t => {
            const active = t.id === 'admin' ? ADMIN_IDS.includes(tab) : tab === t.id;
            const badge = t.id === 'admin' && unlocked && (overdueCount + docCount) > 0;
            return html`
            <button key=${t.id} aria-current=${active ? 'page' : undefined}
              onClick=${() => { if (t.id === 'admin' && !unlocked) return openAdmin(); setTab(t.id); window.scrollTo(0, 0); }}
              className=${'relative flex flex-1 min-w-0 flex-col items-center gap-0.5 rounded-[1.4rem] px-1 py-1.5 sm:py-2 text-[10px] sm:text-xs font-semibold transition ' + (active ? 'grad' : 'text-muted hover:text-[var(--ink)]')}>
              <span className="text-base sm:text-lg leading-none" aria-hidden="true">${t.id === 'admin' ? (unlocked ? '🔓' : '🔒') : t.icon}</span>${t.label}
              ${badge && html`<span className="absolute top-1.5 left-1/2 ms-3 h-2 w-2 rounded-full bg-rose-500"></span>`}
            </button>`;
          })}
        </div>
      </nav>


      ${open && !editing && !paying && !invoicing && !login && html`<${GigDetails} gig=${open} book=${book} sub=${subs.find(s => s.id === open.subId)} admin=${unlocked} update=${update} hasSync=${!!mcpOk}
        onClose=${() => setOpenId(null)} onEdit=${() => setEditing(Object.assign({}, open))}
        onPayKind=${k => { setPayPreset(k); setPayId(open.id); }} onDoc=${k => setDocReq({ id: open.id, kind: k })}
        onUnpay=${() => undoPaid(open)} onAdmin=${openAdmin}
        onDelete=${() => { ask('למחוק את "' + open.title + '"?', { danger: true }).then(ok => { if (ok) { setGigs(l => l.filter(g => g.id !== open.id)); setOpenId(null); setToast('האירוע נמחק'); } }) }} />`}
      ${editing && html`<${Modal} title=${byId(editing.id) ? 'עריכת אירוע' : 'אירוע חדש'} onClose=${() => setEditing(null)} wide>
        <${GigForm} initial=${editing} subs=${subs} clients=${clients} gigs=${gigs} book=${book} admin=${unlocked} isNew=${!byId(editing.id)} onAddType=${addType} onSave=${saveGig} onCancel=${() => setEditing(null)} /><//>`}
      ${paying && html`<${MarkPaid} gig=${paying} preset=${payPreset} onClose=${() => { setPayId(null); setPayPreset(null); }}
        onInvoice=${(num, date) => { const prev = { invIssued: !!paying.invIssued, invNumber: paying.invNumber || '', invDate: paying.invDate || '', docMode: modeOf(paying) }, id = paying.id;
          update(id, { invIssued: true, invNumber: num, invDate: date, docMode: isComb(paying) ? 'split' : modeOf(paying) }); setPayId(null); setPayPreset(null);
          setToast({ msg: '📄 חשבונית מס סומנה כהופקה' + (num ? ' · #' + num : ''), undo: () => { update(id, prev); setToast('הסימון בוטל'); } }); }}
        onConfirm=${(method, date, receipt, newMode) => { const prev = { paidDate: paying.paidDate || '', method: paying.method || '', docNumber: paying.docNumber || '', docIssued: !!paying.docIssued, docMode: modeOf(paying) }, id = paying.id;
          update(id, Object.assign({ paidDate: date, method }, newMode ? { docMode: newMode, docNeeded: newMode !== 'none' } : {}, receipt ? { docNumber: receipt, docIssued: true } : {})); setPayId(null); setPayPreset(null);
          setToast({ msg: money(amt(paying)) + ' התקבלו ב' + method + (receipt ? ' · קבלה ' + receipt : ''), undo: () => { update(id, prev); setToast('הרישום בוטל'); } }); }} />`}
      ${docGig && html`<${DocSheet} gig=${docGig} kind=${docReq.kind} onClose=${() => setDocReq(null)}
        onUnset=${() => { update(docGig.id, docReq.kind === 'inv' ? { invIssued: false } : { docIssued: false }); setDocReq(null); setToast('ההפקה בוטלה'); }}
        onSave=${(num, date) => {
          const g = docGig, k = docReq.kind;
          const patch = k === 'inv' ? { invIssued: true, invNumber: num, invDate: date, docMode: isComb(g) ? 'split' : modeOf(g) }
            : k === 'rec' ? { docIssued: true, docNumber: num, docDate: date, docMode: hasInv(g) ? 'split' : 'receipt' }
            : { docIssued: true, docNumber: num, docDate: date, docMode: 'combined', invIssued: false };
          update(g.id, patch); setDocReq(null); setToast(DOCS[k].name + ' סומנה כהופקה' + (num ? ' · #' + num : ''));
        }} />`}
      ${login && html`<${AdminLogin} adminData=${data.admin} mode=${login} onSuccess=${onLoggedIn} onSetPassword=${onSetPassword} onClose=${() => setLogin(null)} />`}
      ${histOpen && html`<${Modal} title="מכונת הזמן — חזרה אחורה" onClose=${() => setHistOpen(false)}>
        <p className="text-sm text-muted">כל מה ששינית מאז שפתחת את האפליקציה. אפשר לבטל את הפעולה האחרונה, או לחזור לכל נקודה קודמת.</p>
        ${history.length === 0 ? html`<div className="mt-4 rounded-2xl glass-soft p-4 text-sm">
          <b className="block">עוד לא בוצעו פעולות מאז שנפתחה האפליקציה.</b>
          <span className="mt-1 block text-muted">לביטול תשלום שנרשם קודם: לוחצים על העסקה ← <b>↩ ביטול רישום התשלום</b>. הכפתור מופיע בתוך האירוע, בתשלומים (לשונית "שולם"), במסמכים ובכל חלון פירוט.</span>
        </div>` : html`<${Btn} kind="grad" className="mt-3 w-full py-3" onClick=${() => restoreTo(history.length - 1)}><${UndoIcon} size=${18} /> ביטול הפעולה האחרונה<//>`}
        <ol className="relative mt-5 space-y-1 border-r-2 border-[var(--glass-line)] pr-4">
          ${history.slice().reverse().map((e, ri) => { const idx = history.length - 1 - ri; return html`<li key=${e.at + '-' + idx} className="relative">
            <span className="absolute -right-[1.45rem] top-3 h-3 w-3 rounded-full" style=${{ background: ri === 0 ? 'var(--accent2)' : 'var(--glass-line)' }}></span>
            <div className="flex items-center gap-3 rounded-2xl px-2 py-2 hover:bg-[var(--glass)]">
              <span className="text-lg" aria-hidden="true">${e.icon}</span>
              <span className="min-w-0 flex-1"><span className="block truncate font-semibold">${e.label}</span><span className="block truncate text-xs text-muted">${e.who ? e.who + ' · ' : ''}${agoText(e.at)}</span></span>
              <button onClick=${() => ask(ri === 0 ? 'לבטל את "' + e.label + '"?' : 'לחזור למצב שלפני "' + e.label + '"? ' + (ri + 1) + ' הפעולות האחרונות יבוטלו.', { ok: ri === 0 ? 'ביטול' : 'חזרה לנקודה הזו' }).then(ok => ok && restoreTo(idx))}
                className="shrink-0 rounded-full glass-soft px-3 py-1.5 text-xs font-semibold hover:bg-[var(--glass-2)]">${ri === 0 ? 'ביטול' : 'חזרה לכאן'}</button>
            </div></li>`; })}
        </ol>
        <p className="mt-4 text-xs text-muted">ההיסטוריה נשמרת עד שסוגרים את האפליקציה. סנכרון ליומן גוגל לא מושפע — אחרי חזרה אחורה, לחיצה על סנכרון תעדכן גם אותו.</p>
      <//>`}
      ${drillReq && (() => {
        const L = drillReq.list.slice().sort((a, b) => drillReq.sort === 'recent' ? (b.date + (b.start || '')).localeCompare(a.date + (a.start || '')) : drillReq.sort === 'paid' ? (b.paidDate || '').localeCompare(a.paidDate || '') : drillReq.sort === 'due' ? (a.dueDate || '').localeCompare(b.dueDate || '') : (a.date + (a.start || '')).localeCompare(b.date + (b.start || '')));
        const total = L.reduce((a, g) => a + amt(g), 0);
        const subName = g => (subs.find(x => x.id === g.subId) || {}).name || 'מחליף';
        const bySub = drillReq.group === 'sub';
        const byClient = {}; L.forEach(g => { const k = bySub ? subName(g) : (g.client || 'ללא לקוח'); byClient[k] = (byClient[k] || 0) + (bySub ? 1 : amt(g)); });
        const top = Object.entries(byClient).sort((a, b) => b[1] - a[1]);
        return html`<${Modal} title=${drillReq.title} onClose=${() => setDrillReq(null)} wide>
          ${drillReq.sub && html`<p className="-mt-1 mb-3 text-sm text-muted">${drillReq.sub}</p>`}
          <div className="flex items-center gap-3 rounded-2xl glass-soft px-4 py-3">
            <span className="text-3xl font-extrabold grad-text">${unlocked && !bySub && !['date', 'recent'].includes(drillReq.sort) ? money(total) : L.length}</span>
            <span className="text-sm text-muted">${bySub ? (L.length === 1 ? 'אירוע' : 'אירועים') + ' · ' + top.length + ' מחליפים' : ['date', 'recent'].includes(drillReq.sort) ? (L.length === 1 ? 'אירוע' : 'אירועים') + (unlocked && total ? ' · ' + money(total) : '') : L.length + ' ' + (L.length === 1 ? 'עסקה' : 'עסקאות') + (unlocked && top.length > 1 ? ' · ' + top.length + ' לקוחות' : '')}</span>
          </div>
          ${(bySub || (unlocked && !['date', 'recent'].includes(drillReq.sort))) && top.length > (bySub ? 0 : 1) && html`<div className="mt-3 space-y-1.5">${top.slice(0, 6).map(([c, v]) => html`<div key=${c} className="grid grid-cols-[minmax(0,8rem)_1fr_auto] items-center gap-2 text-sm">
            <span className="truncate">${bySub ? SUB_ICON + ' ' : ''}${c}</span><span className="h-2 rounded-full glass-soft overflow-hidden"><span className="block h-full rounded-full grad" style=${{ width: Math.max(5, v / top[0][1] * 100) + '%' }}></span></span><b>${bySub ? v + ' אירועים' : money(v)}</b></div>`)}</div>`}
          ${L.length === 0 ? html`<p className="mt-4 text-center text-sm text-muted">אין כאן כלום כרגע 🎉</p>` : html`
          <ul className="mt-4 space-y-2">${L.map(g => { const st = payStatus(g), late = st === 'באיחור' ? daysBetween(g.dueDate, todayISO()) : 0; return html`<li key=${g.id} className="rounded-2xl glass-soft p-3">
            <button onClick=${() => { setDrillReq(null); setOpenId(g.id); }} className="flex w-full items-start gap-3 text-right">
              <span className="w-1.5 self-stretch rounded-full" style=${{ background: colorOf(g).g }}></span>
              <span className="min-w-0 flex-1">
                <span className="block truncate font-bold">${g.client || autoTitle(g)}</span>
                <span className="block truncate text-sm text-muted">${autoTitle(g)} · ${fmtDate(g.date)}${g.start ? ' · ' + g.start : ''}${g.contactName ? ' · ' + g.contactName : ''}</span>
                ${g.subId && html`<span className="mt-0.5 inline-block rounded-full glass-soft px-2 py-0.5 text-xs font-bold">${SUB_ICON} מחליף: ${subName(g)}${unlocked && Number(g.subFee) ? ' · ' + money(g.subFee) : ''}</span>`}
                <span className="block text-xs text-muted">${g.paidDate ? 'שולם ' + fmtDate(g.paidDate) + (g.method ? ' ב' + g.method : '') : Number(g.fee) ? 'לתשלום עד ' + fmtDate(g.dueDate) : ''}${late > 0 ? html` · <b className="text-bad">${late} ימי איחור</b>` : ''}</span>
              </span>
              ${unlocked && Number(g.fee) > 0 && html`<span className="text-left"><b className="block text-lg">${money(amt(g))}</b><span className=${'text-xs ' + statusCls(st)}>${st}</span></span>`}
            </button>
            ${unlocked && html`<div className="mt-2 flex flex-wrap gap-1.5 ps-4"><${DocChips} gig=${g} />
              ${Number(g.fee) > 0 && !g.paidDate && html`${isOwed(g) && html`<a href=${remindUrl(g)} onClick=${() => markReminded([g])} target="_blank" rel="noopener" className="inline-flex items-center gap-1 rounded-full glass-soft px-3 py-1 text-xs font-semibold">${html`<${MsgIcon} size=${16} />`} תזכורת <${RemindBadge} gigs=${[g]} /></a>`}
                <button onClick=${() => { setDrillReq(null); setPayId(g.id); }} className="rounded-full grad px-3 py-1 text-xs font-semibold">✓ התקבל תשלום</button>`}
              ${recPending(g) && html`<${ReceiptLink} gig=${g} small />`}
              ${g.subId && g.date >= todayISO() && html`<a href=${subRemindUrl(g, subs.find(x => x.id === g.subId))} target="_blank" rel="noopener" className="rounded-full glass-soft px-3 py-1 text-xs font-semibold">${html`<${MsgIcon} size=${16} />`} תזכורת ל${subName(g)}</a>`}
              ${g.paidDate && html`<button onClick=${() => undoPaid(g)} className="rounded-full glass-soft px-3 py-1 text-xs font-semibold">↩ ביטול תשלום</button>`}
            </div>`}
            ${unlocked && !g.paidDate && html`<${RemindNote} gigs=${[g]} className="mt-1 ps-4" />`}
          </li>`; })}</ul>`}
        <//>`;
      })()}
      ${remindAsk && remindAsk.ready && html`<div role="dialog" aria-label="אישור שליחת תזכורת" className="pop fixed inset-x-3 z-[58] mx-auto flex max-w-md items-center gap-2 rounded-2xl glass px-3 py-2.5 shadow-xl" style=${{ top: 'calc(env(safe-area-inset-top, 0px) + 4.2rem)' }}>
        <span className="min-w-0 flex-1 text-sm">שלחת את התזכורת ל<b>${remindAsk.who}</b>?</span>
        <button onClick=${() => { confirmReminded(remindAsk.ids); setRemindAsk(null); }} className="rounded-full grad px-3 py-1.5 text-sm font-bold">✓ כן, נשלחה</button>
        <button onClick=${() => setRemindAsk(null)} className="rounded-full glass-soft px-3 py-1.5 text-sm font-semibold">לא</button>
      </div>`}
      ${secOpen && unlocked && html`<${Secretary} msgs=${secMsgs} setMsgs=${setSecMsgs} gigs=${gigs} clients=${clients} subs=${subs} todos=${todos} run=${secRun} onTodo=${onTodo} onClose=${() => setSecOpen(false)} />`}
      ${quickOpen && html`<${QuickAdd} clients=${clients} subs=${subs} onResult=${quickResult} onClose=${() => setQuickOpen(false)} />`}
      ${confirmReq && html`<${Modal} title=${confirmReq.opts.title || 'אישור'} onClose=${() => closeConfirm(false)} z="z-[70]">
        <p className="text-base">${confirmReq.msg}</p>
        <div className="mt-5 flex gap-2">
          <${Btn} kind=${confirmReq.opts.danger ? 'dangerSolid' : 'grad'} onClick=${() => closeConfirm(true)}>${confirmReq.opts.ok || 'אישור'}<//>
          <${Btn} onClick=${() => closeConfirm(false)}>ביטול<//>
        </div>
      <//>`}
      ${toast && html`<div role="status" className="pop fixed left-1/2 z-[60] -translate-x-1/2 flex items-center gap-3 whitespace-nowrap rounded-full grad px-5 py-2.5 text-sm font-semibold" style=${{ bottom: 'calc(env(safe-area-inset-bottom, 0px) + 6.5rem)' }}>
        <span>${toast.msg || toast}</span>
        ${toast.undo && html`<button onClick=${toast.undo} className="rounded-full bg-white/25 px-3 py-1 font-bold hover:bg-white/35">↩ ביטול</button>`}
      </div>`}
    </div>`;
}

window.__startApp = () => ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
if (window.__startWhenReady) window.__startApp();
})();
</script>
</body>
</html>
