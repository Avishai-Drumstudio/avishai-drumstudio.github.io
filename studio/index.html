<style>
:root {
  --bg: #140d2b; --glow-pct: 100%;
  --ink: #F4F1FF; --muted: #B4ABD6;
  --glass: rgba(255,255,255,.07); --glass-2: rgba(255,255,255,.12); --glass-line: rgba(255,255,255,.14);
  --field: rgba(10,6,30,.45);
  --accent1: #7c3aed; --accent2: #c026d3; --accent3: #ec4899;
  --glow-a: #3b1a78; --glow-b: #8a1f6e; --glow-c: #1b2a6b; --glow-pct: 100%;
  --grad: linear-gradient(90deg, var(--accent1) 0%, var(--accent2) 55%, var(--accent3) 100%);
  --ok: #4ade80; --warn: #fbbf24; --bad: #fb7185;
  --shadow: 0 10px 40px rgba(10,0,40,.45);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f1ecfb; --glow-pct: 32%;
    --ink: #1d1238; --muted: #5e5384;
    --glass: rgba(255,255,255,.55); --glass-2: rgba(255,255,255,.8); --glass-line: rgba(80,40,160,.16);
    --field: rgba(255,255,255,.75);
    --ok: #15803d; --warn: #a16207; --bad: #be123c;
    --shadow: 0 10px 40px rgba(80,40,160,.15);
  }
}
:root[data-theme="light"] {
  --bg: #f1ecfb; --glow-pct: 32%;
  --ink: #1d1238; --muted: #5e5384;
  --glass: rgba(255,255,255,.55); --glass-2: rgba(255,255,255,.8); --glass-line: rgba(80,40,160,.16);
  --field: rgba(255,255,255,.75);
  --ok: #15803d; --warn: #a16207; --bad: #be123c;
  --shadow: 0 10px 40px rgba(80,40,160,.15);
}
:root[data-theme="dark"] {
  --bg: #140d2b; --glow-pct: 100%;
  --ink: #F4F1FF; --muted: #B4ABD6;
  --glass: rgba(255,255,255,.07); --glass-2: rgba(255,255,255,.12); --glass-line: rgba(255,255,255,.14);
  --field: rgba(10,6,30,.45);
  --ok: #4ade80; --warn: #fbbf24; --bad: #fb7185;
  --shadow: 0 10px 40px rgba(10,0,40,.45);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; min-height: 100%; }
body {
  color: var(--ink); font-family: Rubik, 'Arial Hebrew', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  background-color: var(--bg);
  background-image:
    radial-gradient(60rem 40rem at 85% -10%, color-mix(in srgb, var(--glow-a) var(--glow-pct), transparent) 0%, transparent 60%),
    radial-gradient(50rem 40rem at -10% 60%, color-mix(in srgb, var(--glow-b) var(--glow-pct), transparent) 0%, transparent 55%),
    radial-gradient(45rem 35rem at 70% 110%, color-mix(in srgb, var(--glow-c) var(--glow-pct), transparent) 0%, transparent 60%);
  background-attachment: fixed;
}
*, *::before, *::after { box-sizing: border-box; }
img { max-width: 100%; }
input, select, textarea, button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid #f472b6; outline-offset: 2px; }
.glass { background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); box-shadow: 0 6px 24px rgba(10,0,40,.18); }
.glass-soft { background: var(--glass); border: 1px solid var(--glass-line); }
.grad { background: var(--grad); color: #fff; box-shadow: 0 6px 24px color-mix(in srgb, var(--accent3) 35%, transparent); }
.grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.field { width: 100%; background: var(--field); border: 1px solid var(--glass-line); border-radius: 12px; padding: 10px 12px; }
.field:focus { outline: none; border-color: var(--accent2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent2) 25%, transparent); }
select.field option { color: #1d1238; background: #fff; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.scroll-x::-webkit-scrollbar { display: none; }
.pop { animation: pop .22s cubic-bezier(.2,.9,.3,1.2); }
@keyframes pop { from { transform: translateY(14px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.shine { position: relative; overflow: hidden; }
.shine::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%); transform: translateX(120%); animation: shine 3.2s ease-in-out 1s 1; pointer-events: none; }
@keyframes shine { to { transform: translateX(-120%); } }
@media (prefers-reduced-motion: reduce) { .pop, .shine::after { animation: none; } }
.ltr { direction: ltr; unicode-bidi: isolate; }
a[href^="https://wa.me"] { background: #1fa855 !important; color: #fff !important; border-color: transparent !important; }
a[href^="https://wa.me"]:hover { background: #18914a !important; }
</style>

<script>
/* ===== גרסת גוגל: התחברות עם Google + שמירה ב-Firestore. מחליף את window.claude של Claude ===== */
(function () {
  var ALLOWED = (window.STUDIO_ALLOWED || []).map(function (e) { return e.toLowerCase(); });
  var configured = !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey);
  var authReady, resolveAuth; authReady = new Promise(function (r) { resolveAuth = r; });
  var fs = null, started = false;

  function gate(html) {
    var g = document.getElementById('gate');
    if (!g) { g = document.createElement('div'); g.id = 'gate'; document.body.appendChild(g); }
    g.innerHTML = '<div class="card"><img src="icon-192.png" alt=""><h1>Studio Manager</h1>' + html + '</div>';
    return g;
  }
  function hideGate() { var g = document.getElementById('gate'); if (g) g.remove(); }
  function showLogin(msg) {
    var g = gate('<p>התחברות עם חשבון הגוגל שלך</p><button id="gbtn"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>כניסה עם Google</button><div class="err" id="gerr"></div>');
    if (msg) g.querySelector('#gerr').textContent = msg;
    g.querySelector('#gbtn').onclick = signIn;
  }
  function signIn() {
    var p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
    firebase.auth().signInWithPopup(p).catch(function (e) {
      var c = e && e.code;
      if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') return firebase.auth().signInWithRedirect(p);
      if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return;
      showLogin('ההתחברות לא הצליחה (' + (c || 'שגיאה') + '). נסה שוב.');
    });
  }
  window.__studioSignOut = function () { firebase.auth().signOut().then(function () { location.reload(); }); };

  // window.claude: אותו ממשק שהאפליקציה מכירה, רק על Firebase
  function mapPath(path) { return path.replace(/^data\/users\/[^/]+$/, 'studio/main/data'); }
  function docApi(ref) {
    return {
      get: function () { return ref.get().then(function (s) { return { exists: s.exists, data: function () { return s.data(); } }; }); },
      set: function (obj) { return ref.set(JSON.parse(JSON.stringify(obj))).catch(function (e) { throw { code: e && e.code === 'resource-exhausted' ? 'quota_exceeded' : (e && e.code) || 'error', message: String(e && e.message) }; }); }
    };
  }

  /* ===== יומן גוגל: חיבור נפרד (אפשר לבחור כל חשבון גוגל) + קריאות ישירות ל-Calendar API ===== */
  var GTOK_KEY = 'studio-gcal-token', gTok = null;
  try { gTok = JSON.parse(localStorage.getItem(GTOK_KEY) || 'null'); } catch (e) {}
  function tokOk() { return gTok && gTok.t && gTok.exp > Date.now() + 60000; }
  function calPrompt(show) {
    var el = document.getElementById('gcal-prompt');
    if (!show) { if (el) el.remove(); return; }

const PREP_TYPES = ['הופעה'];

const planPrep = (date, lead, n, time, busy) => {
  const t = todayISO(); if (!date) return [];
  let from = addDays(date, -lead); if (from <= t) from = addDays(t, 1);
  const to = addDays(date, -1); if (to < from) return [];
  const span = daysBetween(from, to), out = [];
  const ok = d => d >= from && d <= to && !out.includes(d) && !busy.has(d) && D(d).getDay() !== 6;
  for (let i = 0; i < n; i++) {
    const target = addDays(from, n === 1 ? span : Math.round(span * i / (n - 1)));
    let pick = '';
    for (let k = 0; k <= span && !pick; k++) { if (ok(addDays(target, -k))) pick = addDays(target, -k); else if (ok(addDays(target, k))) pick = addDays(target, k); }
    if (pick) out.push(pick);

  return out.sort().map(d => ({ date: d, time: time || '11:00', done: false }));

    </ul>`}

}

    <span className="mt-0.5 text-[10.5px] leading-tight opacity-80">${dis && k === 'inv' ? 'הופקה' + (gig.invNumber ? ' #' + gig.invNumber : '') : sub}</span></button>`; };
  return html`
    <${Modal} title=${isInv ? 'הפקת חשבונית מס' : 'רישום קבלת תשלום'} onClose=${onClose}>
      <p className="text-sm text-muted">${gig.client || 'לקוח'} · ${gig.title}</p>
      <p className="mt-1 text-4xl font-extrabold grad-text">${money(amt(gig))}</p>
      ${gig.vat !== 'none' && html`<p className="text-sm text-muted">${vatNote(gig)}</p>`}
      ${!noDoc && html`<div className="mt-4">
        <span className="mb-2 block text-xs font-semibold text-muted">איזה מסמך מפיקים?</span>
        <div className="grid grid-cols-3 gap-2">
          ${opt('inv', 'הכסף עוד לא התקבל')}${opt('rec', invDone ? 'הכסף התקבל' : 'הכסף התקבל')}${opt('comb', 'הכסף התקבל עכשיו')}
        </div>
        <p className="mt-2 text-xs text-muted">${isInv ? 'דרישת תשלום. כשהכסף יגיע — מפיקים קבלה.' : kind === 'comb' ? 'מסמך אחד שמכסה גם חשבונית מס וגם קבלה.' : invDone ? 'חשבונית המס כבר הופקה — עכשיו מפיקים קבלה.' : 'קבלה על הכסף שהתקבל.'}</p>
      </div>`}
      ${!isInv && html`
        <span className="mt-4 mb-2 block text-xs font-semibold text-muted">אמצעי תשלום</span>
        <div className="grid grid-cols-3 gap-2">${METHODS.map(m => html`
          <button key=${m} type="button" onClick=${() => setMethod(m)} aria-pressed=${method === m}
            className=${'rounded-2xl px-2 py-3 text-sm font-semibold transition ' + (method === m ? 'grad' : 'glass-soft')}>${m}</button>`)}</div>`}
      <div className=${'mt-4 grid gap-3 ' + (noDoc ? '' : 'grid-cols-2')}>
        <${Label} text=${isInv ? 'תאריך הפקה' : 'תאריך קבלת התשלום'}><input type="date" className="field" value=${date} onChange=${e => setDate(e.target.value)} /><//>
        ${!noDoc && html`<${Label} text=${'מספר ' + docName}><input className="field" inputMode="numeric" value=${num} onChange=${e => setNum(e.target.value)} placeholder="אפשר גם אחר כך" /><//>`}
      </div>
      <div className="mt-5 flex flex-wrap gap-2">
        ${hasReceipt() && !noDoc && html`<a href=${CFG.receiptUrl} target="_blank" rel="noopener" onClick=${confirm}
          className="inline-flex items-center justify-center gap-1.5 rounded-full px-4 py-2 text-sm font-semibold grad">${DOCS[kind].icon} ${isInv ? 'הפקת חשבונית מס' : 'התקבל + הפקת ' + docName}</a>`}
        <${Btn} kind=${hasReceipt() && !noDoc ? 'glass' : 'grad'} onClick=${confirm}>${isInv ? 'סמן שהחשבונית הופקה' : 'סמן שהתשלום התקבל'}<//>
        <${Btn} onClick=${onClose}>ביטול<//>
      </div>
    <//>`;
}

const docTapAction = (g, k, onPay, onDoc) => { const t = docTarget(g, k), st = docState(g, k); return (st !== 'done' && t !== 'inv' && !g.paidDate) ? onPay(t) : onDoc(t); };

function PayPanel({ gig, onPay, onDoc, onUnpay }) {
  const st = payStatus(gig), late = st === 'באיחור' ? daysBetween(gig.dueDate, todayISO()) : 0;
  if (!Number(gig.fee)) return html`<section className="mt-4 rounded-3xl glass-soft p-4 text-sm text-muted">💰 אין סכום לאירוע הזה. אפשר להוסיף סכום שסוכם בעריכה.</section>`;
  return html`<section className="mt-4 rounded-3xl glass-soft p-4" aria-label="תשלום ומסמכים">
    <div className="flex items-center gap-2"><b className="flex-1">💰 תשלום ומסמכים</b><${Status} s=${st} /></div>
    <div className="mt-2 flex flex-wrap items-baseline gap-x-3">
      <span className="text-3xl font-extrabold grad-text">${money(amt(gig))}</span>
      ${vatNote(gig) && html`<span className="text-xs text-muted">${vatNote(gig)}</span>`}
    </div>
    <p className="mt-1 text-sm text-muted">${gig.paidDate ? 'התקבל ' + fmtDate(gig.paidDate) + (gig.method ? ' ב' + gig.method : '') : st === 'עתידי' ? 'האירוע עוד לא התקיים — עדיין לא חוב' : 'לתשלום עד ' + fmtDate(gig.dueDate)}${late > 0 ? html` · <b className="text-bad">${late} ימי איחור</b>` : ''}</p>
    ${modeOf(gig) === 'none' ? html`<p className="mt-3 text-sm text-muted">ללא מסמכים לעסקה זו.</p>` : html`
    <div className="mt-3 grid grid-cols-3 gap-2">${['inv', 'rec', 'comb'].map(k => html`<${DocTile} key=${k} g=${gig} k=${k} onTap=${(g, kk) => docTapAction(g, kk, onPay, onDoc)} />`)}</div>`}
    <div className="mt-3 flex flex-wrap gap-2">
      ${isOwed(gig) && html`<a href=${remindUrl(gig)} onClick=${() => markReminded([gig])} target="_blank" rel="noopener" className="inline-flex items-center gap-1.5 rounded-full glass-soft px-4 py-2 text-sm font-semibold"><${MsgIcon} size=${16} /> תזכורת${remindPhone(gig) ? ' ל' + (gig.contactName || gig.client || 'לקוח') : ''} <${RemindBadge} gigs=${[gig]} /></a>`}
      ${!gig.paidDate && html`<${BankBtn} gigs=${[gig]} phone=${remindPhone(gig)} name=${gig.contactName || gig.client} wide=${true} />`}
      ${gig.paidDate ? html`<${Btn} onClick=${onUnpay}>↩ ביטול רישום התשלום<//>` : html`<${Btn} kind="grad" onClick=${() => onPay(hasInv(gig) ? 'rec' : null)}>✓ התקבל תשלום<//>`}
    </div>
    <${RemindNote} gigs=${[gig]} className="mt-1.5" />
  </section>`;
}

function GigDetails({ gig, sub, admin, book = [], update, hasSync, onEdit, onPayKind, onDoc, onUnpay, onAdmin, onDelete, onClose }) {
  const row = (k, v) => v ? html`<div className="grid grid-cols-[6.5rem_1fr] gap-3 py-2.5 border-b border-[var(--glass-line)] last:border-0"><dt className="text-sm text-muted">${k}</dt><dd className="text-sm whitespace-pre-wrap">${v}</dd></div>` : null;
  const dig = p => (p || '').replace(/\D/g, '').replace(/^972/, '0');
  const samePhone = !!dig(gig.phone) && dig(gig.phone) === dig(gig.contactPhone);
  const samePerson = samePhone && (!gig.contactName || sameName(gig.contactName, gig.client));
  return html`
    <${Modal} title=${gig.title || 'אירוע'} onClose=${onClose} wide>
      <div className="flex flex-wrap items-center gap-2">
        <${TypeChip} type=${gig.type} />
        ${sub && html`<span className="rounded-full glass-soft px-2.5 py-0.5 text-xs font-bold">${SUB_ICON} ${sub.name} מנגן במקומך</span>`}
      </div>
      <p className="mt-3 text-2xl font-bold">${fmtDay(gig.date)} · <span className="ltr">${gig.start || '—'}${gig.end ? '–' + gig.end : ''}</span></p>
      ${admin ? html`<${PayPanel} gig=${gig} onPay=${onPayKind} onDoc=${onDoc} onUnpay=${onUnpay} />` : html`
        <button onClick=${onAdmin} className="mt-4 flex w-full items-center gap-2 rounded-3xl glass-soft p-4 text-right text-sm hover:bg-[var(--glass-2)]"><span aria-hidden="true">🔒</span><span className="flex-1"><b>תשלום ומסמכים</b><span className="block text-muted">כניסה לניהול כדי לראות ולעדכן</span></span><span className="text-muted">‹</span></button>`}
      <dl className="mt-3">
        ${row('הגעה', gig.loadIn)}
        ${row('לקוח', [gig.client, gig.phone, gig.email].filter(Boolean).join('\n'))}
        ${!samePerson && row('איש קשר', personLabel(gig.contactName, gig.contactPhone, book))}
        ${row('מקום', [gig.venue, gig.address].filter(Boolean).join('\n'))}
        ${row('מחליף', sub ? sub.name + (admin && Number(gig.subFee) ? ' · ' + money(gig.subFee) : '') : null)}
        ${row('ציוד', gig.equipment)}
        ${row('הערות', gig.notes)}
      </dl>
      <div className="mt-5 flex flex-wrap gap-2">
        ${!hasSync && html`<${LinkBtn} href=${gcalUrl(gig)}>📅 הוסף ליומן גוגל<//>`}
        ${gig.address && html`<${LinkBtn} href=${'https://waze.com/ul?navigate=yes&q=' + encodeURIComponent(gig.address)}>🚗 ניווט בוויז<//>`}
        ${gig.contactPhone && html`<${LinkBtn} href=${waUrl(gig.contactPhone)}><${MsgIcon} /> ${gig.contactName || nameForPhone(book, gig.contactPhone) || gig.contactPhone}<//>`}
        ${gig.contactPhone && html`<${LinkBtn} href=${'tel:' + gig.contactPhone.replace(/[^\d+]/g, '')}>📞 חיוג<//>`}
        ${gig.phone && !samePhone && html`<${LinkBtn} href=${waUrl(gig.phone)}><${MsgIcon} /> ${gig.client || 'לקוח'}<//>`}
        ${gig.phone && !gig.contactPhone && html`<${LinkBtn} href=${'tel:' + gig.phone.replace(/[^\d+]/g, '')}>📞 חיוג<//>`}
        ${sub && html`<${LinkBtn} href=${subRemindUrl(gig, sub)}>${html`<${MsgIcon} size=${16} />`} תזכורת ל${sub.name}<//>`}
        ${sub && sub.phone && html`<${LinkBtn} href=${waUrl(sub.phone, gigSummary(gig))}>🥁 כל הפרטים ל${sub.name}<//>`}
      </div>
      <div className="mt-3 flex flex-wrap gap-2 border-t border-[var(--glass-line)] pt-4">
        <${Btn} onClick=${onEdit}>עריכה<//>
        <span className="flex-1"></span>
        ${admin && html`<${Btn} kind="danger" onClick=${onDelete}>מחיקה<//>`}
      </div>
    <//>`;
}

/* ===== יומן ===== */
function CalendarView({ gigs, subs = [], onOpen, onAdd, gsyncUI, admin }) {
  const [sheet, setSheet] = useState(null);
  const [showLegend, setShowLegend] = useState(false);
  const t = todayISO();
  const [cursor, setCursor] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const [selected, setSelected] = useState(t);
  const [hidden, setHidden] = useState({});
  const visible = gigs.filter(g => !hidden[g.type]);
  const byDate = useMemo(() => {
    const m = {}; visible.forEach(g => (m[g.date] = m[g.date] || []).push(g));
    Object.values(m).forEach(a => a.sort((x, y) => (x.start || '').localeCompare(y.start || ''))); return m;
  }, [visible]);
  const prepByDate = useMemo(() => { const m = {}; gigs.forEach(g => prepOf(g).forEach(x => (m[x.date] = m[x.date] || []).push({ g, x }))); return m; }, [gigs]);
  const ws = Number(CFG.weekStart) || 0;
  const offset = (cursor.getDay() - ws + 7) % 7;
  const dim = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
  const cells = Array(offset).fill(null).concat(Array.from({ length: dim }, (_, i) => toISO(new Date(cursor.getFullYear(), cursor.getMonth(), i + 1))));
  while (cells.length % 7) cells.push(null);
  const move = n => setCursor(new Date(cursor.getFullYear(), cursor.getMonth() + n, 1));
  const [pick, setPick] = useState(null);
  const years = Array.from(new Set(gigs.map(g => +g.date.slice(0, 4)).concat([new Date().getFullYear()]))).sort();

  return html`
    <div className="space-y-4">
      <${Panel} className="p-0.5 sm:p-5 max-sm:!border-0 max-sm:!bg-transparent max-sm:!shadow-none max-sm:!backdrop-blur-none">
        <div className="flex items-center gap-2 mb-2 px-1 pt-1">
          <button onClick=${() => move(-1)} aria-label="חודש קודם" className="h-10 w-10 flex items-center justify-center rounded-full glass-soft text-muted hover:text-[var(--ink)]">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
          <div className="flex-1 text-center">
            <button onClick=${() => setPick(cursor.getFullYear())} aria-label="בחירת חודש ושנה" className="rounded-xl px-2 hover:bg-[var(--glass)]"><h2 className="text-xl sm:text-3xl font-extrabold">${cursor.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' })} <span className="text-sm text-muted">▾</span></h2><span className="block text-xs text-muted">${hebSpan(cursor.getFullYear(), cursor.getMonth())}</span></button>
            ${(() => { const ym = toISO(cursor).slice(0, 7); const inM = visible.filter(g => g.date.slice(0, 7) === ym); const subsN = inM.filter(g => g.subId).length;
              const mName = cursor.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' });
              return inM.length ? html`<p className="mt-1 flex items-center justify-center gap-1.5 text-xs">
                <button onClick=${() => drill('🥁 האירועים שלי · ' + mName, inM.filter(g => !g.subId), { sort: 'date' })} className="rounded-full glass-soft px-2.5 py-1 font-semibold hover:bg-[var(--glass-2)]">🥁 ${inM.length - subsN} שלי ‹</button>
                ${subsN > 0 && html`<button onClick=${() => drill(SUB_ICON + ' אירועים עם מחליף · ' + mName, inM.filter(g => g.subId), { sort: 'date', group: 'sub' })} className="rounded-full glass-soft px-2.5 py-1 font-semibold hover:bg-[var(--glass-2)]">${SUB_ICON} ${subsN} מחליף ‹</button>`}
              </p>` : null; })()}
          </div>
          <button onClick=${() => move(1)} aria-label="חודש הבא" className="h-10 w-10 flex items-center justify-center rounded-full glass-soft text-muted hover:text-[var(--ink)]">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        </div>
        <div className="grid grid-cols-7 text-center text-xs font-medium text-muted mb-1">
          ${["א'", "ב'", "ג'", "ד'", "ה'", "ו'", "ש'"].slice(ws).concat(["א'", "ב'", "ג'", "ד'", "ה'", "ו'", "ש'"].slice(0, ws)).map(d => html`<div key=${d} className="py-1">${d}</div>`)}
        </div>
        <div className="grid grid-cols-7 gap-1 sm:gap-2">
          ${cells.map((iso, i) => {
            if (!iso) return html`<div key=${'e' + i}></div>`;
            const evs = byDate[iso] || [];
            const isToday = iso === t, isSel = iso === selected;
            const tint = evs.length ? colorOf(evs.slice().sort(mineFirst)[0]).dot : null;
            return html`
              <button key=${iso} onClick=${() => { setSelected(iso); (byDate[iso] || []).length ? setSheet(iso) : prepByDate[iso] ? onOpen(prepByDate[iso][0].g.id) : onAdd(iso); }} aria-label=${fmtDay(iso) + (evs.length ? ', ' + evs.length + ' אירועים' : '')}
                className=${'relative flex flex-col items-stretch min-w-0 min-h-[3.9rem] sm:min-h-[6.5rem] rounded-xl sm:rounded-2xl p-1 sm:p-2 text-right transition border '
                  + (isSel ? 'border-[var(--accent2)] ' : CFG.cellBoxes ? 'border-[var(--glass-line)] hover:border-[var(--accent2)] ' : 'border-transparent hover:border-[var(--glass-line)] ')
                  + (iso < t ? 'opacity-50 ' : '')}
                style=${{ background: tint ? `linear-gradient(160deg, ${tint}50, ${tint}14 75%)` : (CFG.cellBoxes ? 'var(--glass)' : 'transparent') }}>
                <span className=${'text-sm sm:text-base ' + (isToday ? 'self-start inline-flex h-7 w-7 items-center justify-center rounded-full grad font-bold' : evs.length || CFG.cellBoxes ? 'font-bold' : 'font-medium text-muted')}>${Number(iso.slice(8))}</span>
                <span className=${'-mt-0.5 block truncate text-[9px] sm:text-[10px] leading-tight ' + (hebDate(iso).first ? 'font-bold text-[var(--ink)]' : 'text-muted')}>${hebDate(iso).day}</span>
                <span className="flex flex-col gap-0.5 sm:gap-1 mt-0.5 sm:mt-1 min-w-0">
                  ${evs.slice().sort(mineFirst).slice(0, 2).map(g => html`<span key=${g.id} className=${'block truncate rounded-md sm:rounded-full px-1 sm:px-2 py-px sm:py-0.5 text-[9px] sm:text-[11px] leading-tight font-semibold text-white ' + (g.subId ? 'opacity-80' : '')} style=${{ background: g.subId ? subChipBg(g) : colorOf(g).g }}>${g.subId ? SUB_ICON + ' ' : ''}${g.title}</span>`)}
                  ${evs.length > 2 && html`<span className="text-[9px] sm:text-[11px] leading-tight text-muted">+${evs.length - 2}</span>`}
                  ${(prepByDate[iso] || []).slice(0, 1).map(({ g, x }) => html`<span key=${'p' + g.id} title=${'הכנת חומר: ' + autoTitle(g)} className=${'block truncate rounded-md sm:rounded-full border border-dashed border-[var(--accent2)] px-1 sm:px-2 py-px text-[9px] sm:text-[11px] leading-tight font-semibold ' + (x.done ? 'opacity-50 line-through' : '')}>🎼 ${g.client || autoTitle(g)}</span>`)}
                </span>
              </button>`;
          })}
        </div>
        <div className="mt-2 px-1">
          <button onClick=${() => setShowLegend(v => !v)} aria-expanded=${showLegend} className="text-xs font-medium text-muted hover:text-[var(--ink)]">
            ${showLegend ? 'הסתר סוגים ▴' : 'סוגי אירועים' + (Object.values(hidden).some(Boolean) ? ' · חלק מוסתרים' : '') + ' ▾'}</button>
        </div>
        ${gsyncUI}
        ${showLegend && html`<div className="mt-2 flex flex-wrap gap-2 px-1">
          ${TYPES.map(tp => html`<button key=${tp.id} onClick=${() => setHidden(h => Object.assign({}, h, { [tp.id]: !h[tp.id] }))} aria-pressed=${!hidden[tp.id]}
            className=${'rounded-full px-3.5 py-1.5 text-sm font-semibold text-white transition ' + (hidden[tp.id] ? 'opacity-30 grayscale' : '')}
            style=${{ background: tp.g }} title=${hidden[tp.id] ? 'הצג ביומן' : 'הסתר מהיומן'}>${tp.id}</button>`)}
        </div>`}
      <//>
      ${pick && html`<${Modal} title="מעבר לחודש" onClose=${() => setPick(null)}>
        <div className="flex items-center justify-between gap-2">
          <button onClick=${() => setPick(pick - 1)} aria-label="שנה קודמת" className="h-10 w-10 rounded-full glass-soft text-xl">›</button>
          <div className="flex flex-wrap justify-center gap-1.5">${years.filter(y => Math.abs(y - pick) <= 2).map(y => html`<button key=${y} onClick=${() => setPick(y)} className=${'rounded-full px-3 py-1 text-sm font-bold ' + (y === pick ? 'grad' : 'glass-soft')}>${y}</button>`)}</div>
          <button onClick=${() => setPick(pick + 1)} aria-label="שנה הבאה" className="h-10 w-10 rounded-full glass-soft text-xl">‹</button>
        </div>
        <div className="mt-4 grid grid-cols-3 gap-2">${Array.from({ length: 12 }, (_, m) => {
          const ym = pick + '-' + pad(m + 1), n = gigs.filter(g => g.date.slice(0, 7) === ym).length, cur = cursor.getFullYear() === pick && cursor.getMonth() === m;
          return html`<button key=${m} onClick=${() => { setCursor(new Date(pick, m, 1)); setPick(null); }} className=${'rounded-2xl py-3 text-center ' + (cur ? 'grad' : 'glass-soft hover:bg-[var(--glass-2)]')}>
            <b className="block text-sm">${new Date(pick, m, 1).toLocaleDateString('he-IL', { month: 'long' })}</b><span className=${'text-xs ' + (cur ? '' : 'text-muted')}>${n ? n + ' אירועים' : '—'}</span></button>`;
        })}</div>
        <${Btn} className="mt-4 w-full" onClick=${() => { const d = new Date(); setCursor(new Date(d.getFullYear(), d.getMonth(), 1)); setPick(null); }}>חזרה להיום<//>
      <//>`}
      ${sheet && html`<${Modal} title=${fmtDay(sheet) + ' · ' + hebDate(sheet).day + ' ' + hebDate(sheet).month} onClose=${() => setSheet(null)}>
        <button onClick=${() => { const d = sheet; setSheet(null); onAdd(d); }} className="grad shine flex w-full items-center justify-center gap-2 rounded-2xl py-4 text-lg font-bold">＋ הוספת אירוע ביום הזה</button>
        ${[['🥁 אני מנגן', (byDate[sheet] || []).filter(g => !g.subId)], [SUB_ICON + ' מחליף מנגן', (byDate[sheet] || []).filter(g => g.subId)]].filter(x => x[1].length).map(([head, list]) => html`
        <h3 key=${head} className="mt-5 mb-2 text-sm font-semibold text-muted">${head} · ${list.length}</h3>
        <ul key=${head + 'l'} className="space-y-2">${list.map(g => html`
          <li key=${g.id}><button onClick=${() => { setSheet(null); onOpen(g.id); }} className="flex w-full items-center gap-3 rounded-2xl glass-soft p-3 text-right hover:bg-[var(--glass-2)]">
            <span className="w-1.5 self-stretch rounded-full" style=${{ background: colorOf(g).g }}></span>
            <span className="ltr w-12 text-sm font-bold">${g.start || '—'}</span>
            <span className="min-w-0 flex-1"><span className="block truncate font-semibold">${g.title}</span><span className="block truncate text-sm text-muted">${[g.subId && (subs.find(x => x.id === g.subId) || {}).name ? SUB_ICON + ' ' + subs.find(x => x.id === g.subId).name : '', g.venue, g.client].filter(Boolean).join(' · ')}</span></span>
            ${admin && Number(g.fee) > 0 ? html`<${Status} s=${payStatus(g)} />` : html`<${TypeChip} type=${g.type} small />`}
          </button></li>`)}</ul>`)}
      <//>`}
    </div>`;
}

/* ===== סיכום קצר מתחת ליומן ===== */
function QuickStats({ gigs, go }) {
  const t = todayISO();
  const upList = gigs.filter(g => g.date >= t), upcoming = upList.length;
  const unpaid = gigs.filter(isOwed);
  const overdue = unpaid.filter(g => payStatus(g) === 'באיחור');
  const lists = { list: [upList, 'אירועים קרובים', 'date'], payments: [unpaid, 'ממתין לתשלום', 'due'], late: [overdue, 'באיחור בתשלום', 'due'] };

  const undoPaid = g => ask('לבטל את רישום התשלום של ' + (g.client || g.title) + '? הוא יחזור להיות "ממתין".', { ok: 'ביטול תשלום' }).then(ok => ok && update(g.id, { paidDate: '', method: '' }));

  const counts = { 'פתוחים': 0, 'באיחור': 0, 'ממתין': 0, 'עתידי': 0, 'שולם': 0, 'הכל': billable.length };
  billable.forEach(g => { const s = payStatus(g); counts[s] = (counts[s] || 0) + 1; if (s === 'ממתין' || s === 'באיחור') counts['פתוחים']++; });
  const future = billable.filter(g => payStatus(g) === 'עתידי');
  const list = billable.filter(g => { const s = payStatus(g); return filter === 'הכל' || s === filter || (filter === 'פתוחים' && (s === 'ממתין' || s === 'באיחור')); })

  const [view, setView] = useState('event');
  const owedGigs = billable.filter(isOwed);

    c.phone = c.phone || g.contactPhone || g.phone; c.contact = c.contact || g.contactName; c.total += amt(g); c.gigs.push(g); if (payStatus(g) === 'באיחור') c.overdue += amt(g); });
  const debtors = Object.values(groups).sort((a, b) => (b.overdue ? 1 : 0) - (a.overdue ? 1 : 0) || b.total - a.total);
  const sum = l => l.reduce((a, g) => a + amt(g), 0);
  const total = sum(owedGigs), lateTotal = sum(owedGigs.filter(g => payStatus(g) === 'באיחור'));

  return html`

        </button>
        <p className="mt-1 text-xs text-muted">
          ${lateTotal > 0 && html`<b className="text-bad">${money(lateTotal)} באיחור</b> · `}${debtors.length} ${debtors.length === 1 ? 'לקוח' : 'לקוחות'} · רק אירועים שכבר התקיימו
          ${future.length > 0 && html` · <button onClick=${() => drill('אירועים עתידיים — עוד לא חוב', future, { sort: 'date' })} className="font-semibold underline">עוד ${money(sum(future))} באירועים עתידיים ‹</button>`}
        </p>
        <div className="mt-3 flex gap-1 rounded-full glass-soft p-1 text-xs font-semibold" role="radiogroup" aria-label="תצוגה">
          <button role="radio" aria-checked=${view === 'event'} onClick=${() => setView('event')} className=${'flex-1 rounded-full py-1.5 ' + (view === 'event' ? 'grad' : 'text-muted')}>כל אירוע בנפרד</button>
          <button role="radio" aria-checked=${view === 'client'} onClick=${() => setView('client')} className=${'flex-1 rounded-full py-1.5 ' + (view === 'client' ? 'grad' : 'text-muted')}>סה״כ לפי לקוח</button>
        </div>
      <//>

          <li key=${c.name} className=${'glass rounded-3xl p-4 ' + (c.overdue ? 'ring-1 ring-rose-400/60' : '')}>
            <div className="flex items-start gap-3">
              <b className="min-w-0 flex-1 truncate">${c.name}<span className="block text-xs font-normal text-muted">${c.gigs.length} ${c.gigs.length === 1 ? 'אירוע' : 'אירועים'}${c.contact ? ' · ' + c.contact : ''}</span></b>
              <span className="text-left"><b className="block text-xl leading-tight grad-text">${money(c.total)}</b>${c.overdue > 0 ? html`<span className="text-xs font-bold text-bad">${money(c.overdue)} באיחור</span>` : html`<span className="text-xs text-muted">ממתין</span>`}</span>
            </div>
            <ul className="mt-2 space-y-1 border-t border-[var(--glass-line)] pt-2">${c.gigs.map(g => html`<li key=${g.id}><button onClick=${() => onOpen(g.id)} className="flex w-full gap-2 text-right text-sm"><span className="min-w-0 flex-1 truncate text-muted">${autoTitle(g)} · ${fmtDate(g.date)}</span><b>${money(amt(g))}</b></button></li>`)}</ul>
            <div className="mt-3 grid grid-cols-3 gap-1.5">

              <${BankBtn} gigs=${c.gigs} phone=${c.phone} name=${c.contact || c.name} />

      <${Chips} items=${['פתוחים', 'באיחור', 'ממתין', 'עתידי', 'שולם', 'הכל']} value=${filter} onChange=${setFilter} counts=${counts} />
      ${list.length === 0 ? html`<${Empty}>אין תשלומים בסינון הזה.<//>` : html`
      <ul className="space-y-2">${list.map(g => {
        const s = payStatus(g), late = s === 'באיחור' ? daysBetween(g.dueDate, t) : 0;

              <button onClick=${() => undoPaid(g)} className="flex min-w-0 items-center justify-center gap-1.5 rounded-full py-2.5 text-sm font-semibold glass-soft text-muted hover:text-[var(--ink)]">↩ ביטול תשלום</button>`
            : html`

/* ===== מסמכים / מס ===== */
const DocTile = ({ g, k, onTap }) => {

  return html`<button disabled=${st === 'off'} onClick=${() => onTap(g, k, st)} className=${'flex min-w-0 flex-col items-center justify-center rounded-2xl px-1.5 py-2.5 text-center transition disabled:cursor-default ' + cls}>

};

        <button onClick=${() => drill('חשבוניות מס פתוחות', openInv, { sort: 'due', sub: 'נשלחה חשבונית מס, והתשלום עוד לא התקבל.' })} className="glass rounded-3xl p-4 text-right hover:bg-[var(--glass-2)]"><span className="block text-sm text-muted">📄 חשבוניות מס פתוחות</span><span className="block text-3xl font-extrabold">${openInv.length}</span><span className="block text-xs text-muted">${sum(openInv)} ממתינים לתשלום</span><${MoreHint} /></button>
        <button onClick=${() => drill('הכנסות שהתקבלו ב־' + yr, rows.filter(g => g.paidDate && g.paidDate.slice(0, 4) === yr), { sort: 'paid' })} className="glass rounded-3xl p-4 text-right hover:bg-[var(--glass-2)]"><span className="block text-sm text-muted">הכנסות שהתקבלו ב־${yr}</span><span className="block text-3xl font-extrabold grad-text">${money(yearIn)}</span><span className="block text-xs text-muted">לפי תשלומים שנרשמו</span><${MoreHint} /></button>
      </div>
      <div className="rounded-2xl glass-soft px-4 py-3 text-xs leading-relaxed text-muted">
        <b>📄 חשבונית מס</b> — דרישת תשלום, לפני שהכסף מתקבל · <b>🧾 קבלה</b> — כשהכסף מתקבל · <b>📑 חשבונית מס/קבלה</b> — מסמך אחד כשהכסף מתקבל מיד. לוחצים על המסמך שהפקת.
      </div>
      <div className="flex flex-wrap items-center gap-2">
        <div className="flex-1 min-w-0"><${Chips} items=${Object.keys(F)} value=${filter} onChange=${setFilter} counts=${Object.fromEntries(Object.entries(F).map(([k, v]) => [k, v.length]))} /></div>
        <${Btn} onClick=${exportCsv}>ייצוא לרואה חשבון (CSV)<//>
      </div>
      ${list.length === 0 ? html`<${Empty}>אין עסקאות כאן.<//>` : html`
      <ul className="space-y-2">${list.map(g => html`<li key=${g.id} className=${'glass rounded-3xl p-3.5 ' + (recPending(g) ? 'ring-1 ring-rose-400/60' : '')}>
        <button onClick=${() => onOpen(g.id)} className="flex w-full items-start gap-3 text-right">
          <span className="min-w-0 flex-1">
            <b className="block truncate">${g.client || autoTitle(g)}</b>
            <span className="block truncate text-xs text-muted">${autoTitle(g)} · ${fmtDate(g.date)}</span>
          </span>
          <span className="text-left"><b className="block text-lg leading-tight">${money(amt(g))}</b><span className=${'text-xs ' + statusCls(payStatus(g))}>${g.paidDate ? 'שולם ' + fmtDate(g.paidDate) : payStatus(g)}</span></span>
        </button>
        ${g.paidDate && html`<button onClick=${() => onUnpay(g)} className="mt-1 text-xs font-semibold text-muted hover:text-[var(--ink)]">↩ ביטול רישום התשלום</button>`}
        ${modeOf(g) === 'none' ? html`<div className="mt-2 flex items-center justify-between text-sm text-muted"><span>ללא מסמכים לעסקה זו</span><button onClick=${() => update(g.id, { docMode: 'split', docNeeded: true })} className="font-semibold grad-text">החזרת מסמכים</button></div>` : html`
        <div className="mt-3 grid grid-cols-3 gap-2">
          <${DocTile} g=${g} k="inv" onTap=${tap} /><${DocTile} g=${g} k="rec" onTap=${tap} /><${DocTile} g=${g} k="comb" onTap=${tap} />
        </div>`}
      </li>`)}</ul>`}
      <p className="text-xs text-muted">מעקב בלבד. את המסמכים עצמם מפיקים בתוכנת החשבוניות שלך — ובכל שאלה, כדאי לבדוק מול רואה החשבון.</p>
    </div>`;
}

/* ===== לקוחות ===== */
function PhonebookImport({ book, setBook }) {
  const fileRef = useRef(null), [help, setHelp] = useState(false);
  const merge = list => { const m = new Map(book.map(k => [k.name + '|' + k.phone, k])); list.forEach(k => m.set(k.name + '|' + k.phone, k)); const all = Array.from(m.values()).sort((a, b) => a.name.localeCompare(b.name, 'he')); setBook(all); notify('נוספו ' + list.length + ' אנשי קשר · סה״כ ' + all.length); };
  const onFile = e => { const f = e.target.files && e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { const list = parseVcf(String(r.result || '')); list.length ? merge(list) : notify('לא נמצאו אנשי קשר בקובץ'); e.target.value = ''; }; r.readAsText(f); };
  const pick = async () => { try { const res = await navigator.contacts.select(['name', 'tel'], { multiple: true }); merge(res.map(c => ({ name: (c.name || [])[0] || '', phone: localPhone((c.tel || [])[0] || '') })).filter(k => k.name && k.phone)); } catch (e) {} };
  return html`<div className="rounded-2xl glass-soft p-3">
    <div className="flex flex-wrap items-center gap-2">
      <span className="flex-1 text-sm"><b>📇 אנשי הקשר מהטלפון</b><span className="block text-xs text-muted">${book.length ? book.length + ' אנשי קשר זמינים להשלמה אוטומטית' : 'ייבוא פעם אחת — ואז השם והטלפון משלימים את עצמם'}</span></span>
      ${canPickContacts() && html`<${Btn} kind="grad" onClick=${pick}>בחירה מאנשי הקשר<//>`}
      <${Btn} kind=${canPickContacts() ? 'glass' : 'grad'} onClick=${() => fileRef.current && fileRef.current.click()}>ייבוא מקובץ<//>
      <input ref=${fileRef} type="file" accept=".vcf,text/vcard,text/x-vcard" className="hidden" onChange=${onFile} />
    </div>
    <button onClick=${() => setHelp(v => !v)} className="mt-2 text-xs font-semibold text-muted underline">איך מוציאים את אנשי הקשר מהאייפון?</button>
    ${help && html`<ol className="mt-2 list-decimal space-y-1 pr-5 text-xs text-muted">
      <li>פתח את אפליקציית <b>אנשי קשר</b> ← למעלה משמאל <b>רשימות</b>.</li>
      <li>לחיצה ארוכה על <b>כל אנשי הקשר</b> ← <b>ייצוא</b> ← <b>שמור בקבצים</b>.</li>
      <li>חזור לכאן ← <b>ייבוא מקובץ</b> ← בחר את הקובץ ששמרת.</li>
    </ol>`}
    ${book.length > 0 && html`<button onClick=${() => ask('למחוק את כל אנשי הקשר המיובאים? (הלקוחות ואנשי הקשר באירועים לא יימחקו)', { danger: true, ok: 'מחיקה' }).then(ok => { if (ok) { setBook([]); notify('אנשי הקשר המיובאים נמחקו'); } })} className="mt-2 mr-3 text-xs text-bad underline">מחיקת הרשימה</button>`}
  </div>`;
}

function Clients({ book = [], setBook, admin, gigs, clients, setClients, onRename, onOpen }) {
  const [q, setQ] = useState(''), [openC, setOpenC] = useState(null), [edit, setEdit] = useState(null);
  const stats = c => {
    const gs = gigs.filter(g => sameName(g.client, c.name)).sort((a, b) => b.date.localeCompare(a.date));
    return { gigs: gs, total: gs.reduce((a, g) => a + amt(g), 0), owed: gs.filter(isOwed).reduce((a, g) => a + amt(g), 0) };
  };
  const list = clients.filter(c => !q || c.name.toLowerCase().includes(q.toLowerCase()) || (c.phone || '').includes(q))
    .map(c => Object.assign({ s: stats(c) }, c)).sort((a, b) => b.s.total - a.s.total || a.name.localeCompare(b.name, 'he'));
  const save = c => {
    const name = cleanName(c.name);
    const twin = clients.find(x => x.id !== c.id && sameName(x.name, name));
    if (twin) {
      const old0 = clients.find(x => x.id === c.id);
      ask('כבר יש לקוח בשם "' + twin.name + '". לאחד את שניהם ללקוח אחד? כל האירועים יעברו אליו, ואנשי הקשר שלו יישארו כמו שהם.', { ok: 'איחוד' }).then(ok => {
        if (!ok) return;
        const seen = new Set(), contacts = [];
        (twin.contacts || []).forEach(k => { const n = cleanName(k.name), ph = (k.phone || '').trim(); const key = n.toLowerCase() + '|' + ph; if ((n || ph) && !seen.has(key)) { seen.add(key); contacts.push({ name: n, phone: ph }); } });
        const merged = Object.assign({}, twin, { phone: twin.phone || c.phone, email: twin.email || c.email, notes: [twin.notes, c.notes].filter(Boolean).join(' · '), contacts });
        if (old0) onRename(old0.name, twin.name);
        setClients(l => l.filter(x => x.id !== c.id).map(x => x.id === twin.id ? merged : x));
        setEdit(null); notify('הלקוחות אוחדו ל"' + twin.name + '"');
      });
      return;
    }
    const old = clients.find(x => x.id === c.id);
    if (old && old.name !== name) onRename(old.name, name);
    const rec = Object.assign({}, c, { name, contacts: (c.contacts || []).filter(k => (k.name || '').trim() || (k.phone || '').trim()) });
    setClients(l => old ? l.map(x => x.id === c.id ? rec : x) : l.concat([rec]));
    setEdit(null);
  };
  return html`
    <div className="space-y-3">
      <div className="flex gap-2">
        <input type="search" className="field flex-1" placeholder="חיפוש לקוח לפי שם או טלפון" value=${q} onChange=${e => setQ(e.target.value)} aria-label="חיפוש לקוח" />
        <${Btn} kind="grad" onClick=${() => setEdit({ id: uid(), name: '', phone: '', email: '', notes: '', contacts: [] })}>+ לקוח<//>
      </div>
      <p className="text-xs text-muted">${clients.length} לקוחות במאגר. כשמוסיפים אירוע, מתחילים להקליד שם והטלפון והמייל מתמלאים לבד. לקוח חדש נשמר במאגר אוטומטית.</p>
      ${list.length === 0 ? html`<${Empty}>${q ? 'לא נמצא לקוח בשם הזה.' : 'המאגר ריק. לקוחות נכנסים אליו אוטומטית כשמוסיפים אירוע.'}<//>` : html`
      <ul className="grid gap-3 md:grid-cols-2">${list.map(c => html`
        <li key=${c.id} className="glass rounded-3xl p-4">
          <button className="w-full text-right" onClick=${() => setOpenC(openC === c.id ? null : c.id)} aria-expanded=${openC === c.id}>
            <div className="flex items-center gap-3">
              <span className="grad h-11 w-11 shrink-0 rounded-full flex items-center justify-center text-lg font-bold">${c.name.slice(0, 1)}</span>
              <span className="min-w-0 flex-1"><span className="block font-bold truncate">${c.name}</span><span className="block text-sm text-muted ltr text-right">${c.phone || '—'}</span></span>
              <span className="text-left">${admin && html`<span className="block font-extrabold">${money(c.s.total)}</span>`}<span className="block text-xs text-muted">${c.s.gigs.length} אירועים</span></span>
            </div>
            ${admin && c.s.owed > 0 && html`<span className="mt-2 inline-block rounded-full glass-soft px-2.5 py-0.5 text-xs font-bold text-warn">חייב ${money(c.s.owed)}</span>`}
            ${(c.contacts || []).length > 0 && html`<p className="mt-2 text-sm text-muted">אנשי קשר: ${c.contacts.map(k => personLabel(k.name, k.phone, book)).join(' | ')}</p>`}
            ${c.notes && html`<p className="mt-1 text-sm text-muted">${c.notes}</p>`}
          </button>
          ${openC === c.id && html`
            <div className="mt-3 flex flex-wrap gap-2">
              ${c.phone && html`<${LinkBtn} href=${waUrl(c.phone)}><${MsgIcon} /> הודעה<//>`}
              ${c.phone && html`<${LinkBtn} href=${'tel:' + c.phone.replace(/[^\d+]/g, '')}>📞 חיוג<//>`}
              ${c.email && html`<${LinkBtn} href=${'mailto:' + c.email}>✉️ מייל<//>`}
              <${Btn} onClick=${() => setEdit({ id: c.id, name: c.name, phone: c.phone || '', email: c.email || '', notes: c.notes || '', contacts: (c.contacts || []).slice() })}>עריכה<//>
            </div>
            ${(c.contacts || []).length > 0 && html`<ul className="mt-3 space-y-1.5">${c.contacts.map(k => html`<li key=${k.name + k.phone} className="flex items-center gap-2 rounded-2xl glass-soft px-3 py-2 text-sm">
              <span className="flex-1 truncate"><b>${k.name || nameForPhone(book, k.phone) || 'ללא שם'}</b> <span className="ltr text-muted">${k.phone}</span></span>
              ${k.phone && html`<a href=${waUrl(k.phone)} target="_blank" rel="noopener" aria-label=${'הודעה בוואטסאפ ל' + k.name} className="inline-flex rounded-full px-2 py-1"><${MsgIcon} size=${16} /></a><a href=${'tel:' + k.phone.replace(/[^\d+]/g, '')} aria-label=${'חיוג ל' + k.name} className="rounded-full px-2 py-1 hover:bg-[var(--glass-2)]">📞</a>`}
            </li>`)}</ul>`}
            ${c.s.gigs.length > 0 && html`<ul className="mt-3 divide-y divide-[var(--glass-line)]">${c.s.gigs.map(g => html`
              <li key=${g.id}><button onClick=${() => onOpen(g.id)} className="flex w-full items-center gap-2 py-2 text-right text-sm">
                <span className="flex-1 truncate">${fmtDate(g.date)} · ${g.title}</span>${admin && html`<${Status} s=${payStatus(g)} />`}</button></li>`)}</ul>`}`}
        </li>`)}</ul>`}
      ${edit && html`<${Modal} title=${clients.some(x => x.id === edit.id) ? 'עריכת לקוח' : 'לקוח חדש'} onClose=${() => setEdit(null)}>
        <div className="space-y-3">
          <${Label} text="שם"><${BookName} value=${edit.name} book=${book} onType=${v => setEdit(Object.assign({}, edit, { name: v }))} onPick=${k => setEdit(Object.assign({}, edit, { name: k.name, phone: edit.phone || k.phone }))} /><//>
          <${Label} text="טלפון"><input type="tel" className="field ltr text-right" value=${edit.phone} onChange=${e => setEdit(Object.assign({}, edit, { phone: e.target.value }))} /><//>
          <${Label} text="מייל"><input type="email" className="field ltr text-right" value=${edit.email} onChange=${e => setEdit(Object.assign({}, edit, { email: e.target.value }))} /><//>
          <div>
            <span className="mb-1 block text-xs font-semibold text-muted">אנשי קשר</span>
            ${(edit.contacts || []).map((k, i) => html`<div key=${i} className="mb-2 grid grid-cols-[1.4fr_1fr_auto] gap-2">
              <${BookName} label="שם איש קשר" value=${k.name} book=${book} onType=${v => { const l = edit.contacts.slice(); l[i] = Object.assign({}, k, { name: v }); setEdit(Object.assign({}, edit, { contacts: l })); }} onPick=${b => { const l = edit.contacts.slice(); l[i] = { name: b.name, phone: b.phone }; setEdit(Object.assign({}, edit, { contacts: l })); }} />
              <input type="tel" className="field ltr text-right" aria-label="טלפון איש קשר" placeholder="טלפון" value=${k.phone} onChange=${e => { const l = edit.contacts.slice(); l[i] = Object.assign({}, k, { phone: e.target.value }); setEdit(Object.assign({}, edit, { contacts: l })); }} />
              <button type="button" aria-label="הסר איש קשר" onClick=${() => setEdit(Object.assign({}, edit, { contacts: edit.contacts.filter((_, j) => j !== i) }))} className="h-10 w-10 rounded-full glass-soft text-bad">×</button>
            </div>`)}
            <button type="button" onClick=${() => setEdit(Object.assign({}, edit, { contacts: (edit.contacts || []).concat([{ name: '', phone: '' }]) }))} className="text-sm font-semibold grad-text">+ איש קשר</button>
          </div>
          <${Label} text="הערות"><textarea rows="3" className="field" value=${edit.notes} onChange=${e => setEdit(Object.assign({}, edit, { notes: e.target.value }))} placeholder="למשל: משלם תמיד בהעברה, צריך חשבונית מס"></textarea><//>
          <div className="flex gap-2 pt-2">
            <${Btn} kind="grad" disabled=${!edit.name.trim()} onClick=${() => save(edit)}>שמירה<//>
            <${Btn} onClick=${() => setEdit(null)}>ביטול<//>
            <span className="flex-1"></span>
            ${clients.some(x => x.id === edit.id) && html`<${Btn} kind="danger" onClick=${() => { ask('להסיר את ' + edit.name + ' מהמאגר? האירועים שלו יישארו.', { danger: true }).then(ok => { if (ok) { setClients(l => l.filter(x => x.id !== edit.id)); setEdit(null); } }) }}>הסרה מהמאגר<//>`}
          </div>
        </div>
      <//>`}
    </div>`;
}

/* ===== מחליפים ===== */
function Subs({ admin, subs, gigs, setSubs, onOpen, book = [] }) {
  const [edit, setEdit] = useState(null);
  const t = todayISO();
  const save = s => { setSubs(l => l.some(x => x.id === s.id) ? l.map(x => x.id === s.id ? s : x) : l.concat([s])); setEdit(null); };
  return html`
    <div className="space-y-3">
      <div className="flex items-center gap-2"><p className="flex-1 text-sm text-muted">מתופפים שאפשר להעביר אליהם עבודות. משייכים מחליף לאירוע מתוך טופס האירוע.</p>
        <${Btn} kind="grad" onClick=${() => setEdit({ id: uid(), name: '', phone: '', notes: '' })}>+ מחליף<//></div>
      ${subs.length === 0 ? html`<${Empty}>עדיין אין מחליפים ברשימה.<//>` : html`
      <ul className="grid gap-3 md:grid-cols-2">${subs.map(s => {
        const mine = gigs.filter(g => g.subId === s.id).sort((a, b) => a.date.localeCompare(b.date));
        const owe = mine.filter(g => g.date < t).reduce((a, g) => a + (Number(g.subFee) || 0), 0);
        return html`<li key=${s.id} className="glass rounded-3xl p-4">
          <div className="flex items-center gap-3">
            <span className="h-11 w-11 shrink-0 rounded-full flex items-center justify-center text-xl" style=${{ background: 'linear-gradient(135deg,#1d4ed8,#a855f7)' }}>🥁</span>
            <span className="min-w-0 flex-1"><span className="block font-bold">${s.name}</span><span className="block text-sm text-muted ltr text-right">${s.phone}</span></span>
            <${Btn} kind="ghost" onClick=${() => setEdit(Object.assign({}, s))}>עריכה<//>
          </div>
          ${s.notes && html`<p className="mt-2 text-sm text-muted">${s.notes}</p>`}
          <div className="mt-3 flex flex-wrap gap-2">${s.phone && html`<${LinkBtn} href=${waUrl(s.phone)}><${MsgIcon} /> הודעה<//>`}${admin && owe > 0 && html`<span className="rounded-full glass-soft px-3 py-2 text-sm">שולם/לתשלום על עבודות שעברו: <b>${money(owe)}</b></span>`}</div>
          ${mine.length > 0 && html`<ul className="mt-3 divide-y divide-[var(--glass-line)]">${mine.map(g => html`
            <li key=${g.id} className="flex items-center gap-2 py-1.5"><button onClick=${() => onOpen(g.id)} className="flex min-w-0 flex-1 gap-2 py-1 text-right text-sm"><span className="flex-1 truncate">${fmtDate(g.date)} · ${g.title}</span>${admin && Number(g.subFee) > 0 && html`<span className="font-bold">${money(g.subFee)}</span>`}</button>
              ${g.date >= todayISO() && html`<a href=${subRemindUrl(g, s)} target="_blank" rel="noopener" className="shrink-0 rounded-full glass-soft px-3 py-1 text-xs font-semibold">${html`<${MsgIcon} size=${16} />`} תזכורת</a>`}</li>`)}</ul>`}
        </li>`;
      })}</ul>`}
      ${edit && html`<${Modal} title=${subs.some(x => x.id === edit.id) ? 'עריכת מחליף' : 'מחליף חדש'} onClose=${() => setEdit(null)}>
        <div className="space-y-3">
          <${Label} text="שם"><${BookName} value=${edit.name} book=${book} onType=${v => setEdit(Object.assign({}, edit, { name: v }))} onPick=${k => setEdit(Object.assign({}, edit, { name: k.name, phone: edit.phone || k.phone }))} /><//>
          <${Label} text="טלפון"><input type="tel" className="field ltr text-right" value=${edit.phone} onChange=${e => setEdit(Object.assign({}, edit, { phone: e.target.value }))} /><//>
          <${Label} text="הערות"><textarea rows="3" className="field" value=${edit.notes} onChange=${e => setEdit(Object.assign({}, edit, { notes: e.target.value }))} placeholder="סגנונות, זמינות, ציוד…"></textarea><//>
          <div className="flex gap-2 pt-2">
            <${Btn} kind="grad" disabled=${!edit.name.trim()} onClick=${() => save(edit)}>שמירה<//>
            <${Btn} onClick=${() => setEdit(null)}>ביטול<//>
            <span className="flex-1"></span>
            ${subs.some(x => x.id === edit.id) && html`<${Btn} kind="danger" onClick=${() => { ask('למחוק את ' + edit.name + '?', { danger: true }).then(ok => { if (ok) { setSubs(l => l.filter(x => x.id !== edit.id)); setEdit(null); } }) }}>מחיקה<//>`}
          </div>
        </div>
      <//>`}
    </div>`;
}

/* ===== הגדרות ===== */
function Section({ icon, title, sub, open, onToggle, children }) {
  return html`
    <div className="glass rounded-3xl overflow-hidden">
      <button onClick=${onToggle} aria-expanded=${open} className="flex w-full items-center gap-3 px-5 py-4 text-right hover:bg-[var(--glass)]">
        <span className="text-xl" aria-hidden="true">${icon}</span>
        <span className="flex-1 min-w-0"><span className="block font-bold">${title}</span>${sub && html`<span className="block truncate text-xs text-muted">${sub}</span>`}</span>
        <span className=${'text-muted transition ' + (open ? 'rotate-180' : '')} aria-hidden="true">▾</span>
      </button>
      ${open && html`<div className="border-t border-[var(--glass-line)] px-5 py-4">${children}</div>`}
    </div>`;
}

function ColorField({ label, value, onChange }) {
  return html`<label className="flex items-center gap-2 rounded-2xl glass-soft px-3 py-2 text-sm">
    <input type="color" value=${value} onChange=${e => onChange(e.target.value)} className="h-8 w-10 cursor-pointer rounded-lg border-0 bg-transparent p-0" />
    <span className="flex-1">${label}</span><span className="ltr text-xs text-muted">${value}</span></label>`;
}

function ListEditor({ items, onChange, placeholder }) {
  const [v, setV] = useState('');
  const add = () => { const x = v.trim(); if (!x || items.includes(x)) return; onChange(items.concat([x])); setV(''); };
  return html`<div>
    <ul className="flex flex-wrap gap-2">${items.map((x, i) => html`<li key=${x} className="flex items-center gap-1 rounded-full glass-soft ps-3 pe-1 py-1 text-sm">
      <span>${x}</span>
      <button aria-label=${'העבר ימינה ' + x} disabled=${i === 0} onClick=${() => { const n = items.slice(); n.splice(i - 1, 0, n.splice(i, 1)[0]); onChange(n); }} className="h-6 w-6 rounded-full text-muted disabled:opacity-20 hover:bg-[var(--glass-2)]">→</button>
      <button aria-label=${'הסר ' + x} disabled=${items.length <= 1} onClick=${() => onChange(items.filter(y => y !== x))} className="h-6 w-6 rounded-full text-bad disabled:opacity-20 hover:bg-[var(--glass-2)]">×</button>
    </li>`)}</ul>
    <div className="mt-3 flex gap-2"><input className="field flex-1" value=${v} placeholder=${placeholder} onChange=${e => setV(e.target.value)} onKeyDown=${e => e.key === 'Enter' && (e.preventDefault(), add())} /><${Btn} kind="grad" onClick=${add} disabled=${!v.trim()}>הוספה<//></div>
  </div>`;
}

function TypeEditor({ cfg, gigs, setConfig, renameType, toast }) {
  const [edit, setEdit] = useState(null); // {orig, name, c1, c2}
  const types = cfg.types;
  const count = n => gigs.filter(g => g.type === n).length;
  const [moveTo, setMoveTo] = useState('');
  const move = (i, d) => { const n = types.slice(); const j = i + d; if (j < 0 || j >= n.length) return; [n[i], n[j]] = [n[j], n[i]]; setConfig({ types: n }); };
  const save = () => {
    const name = edit.name.trim(); if (!name) return;
    if (types.some(t => t.name === name && t.name !== edit.orig)) { notify('כבר יש קטגוריה בשם הזה'); return; }
    const rec = Object.assign({ name, c1: edit.c1, c2: edit.c2 }, edit.gcolor ? { gcolor: edit.gcolor } : {});
    if (edit.orig == null) setConfig({ types: types.concat([rec]) });
    else { setConfig({ types: types.map(t => t.name === edit.orig ? rec : t) }); if (edit.orig !== name) renameType(edit.orig, name); }
    setEdit(null); toast('הקטגוריה נשמרה');
  };
  const del = () => {
    const used = count(edit.orig);
    const target = moveTo || (types.find(t => t.name !== edit.orig) || {}).name;
    const orig = edit.orig;
    ask(used ? `להסיר את הקטגוריה "${orig}"? ${used} אירועים יועברו ל"${target}".` : `להסיר את הקטגוריה "${orig}"?`, { danger: true, ok: 'הסרה' }).then(ok => {
      if (!ok) return;
      if (used) renameType(orig, target);
      setConfig({ types: types.filter(t => t.name !== orig) }); setEdit(null); toast('הקטגוריה "' + orig + '" הוסרה');
    });
  };
  return html`<div>
    <ul className="space-y-2">${types.map((t, i) => html`<li key=${t.name} className="flex items-center gap-2">
      <div className="flex flex-col">
        <button aria-label="הזז למעלה" disabled=${i === 0} onClick=${() => move(i, -1)} className="h-5 w-7 text-xs text-muted disabled:opacity-20">▲</button>
        <button aria-label="הזז למטה" disabled=${i === types.length - 1} onClick=${() => move(i, 1)} className="h-5 w-7 text-xs text-muted disabled:opacity-20">▼</button>
      </div>
      <button onClick=${() => { setMoveTo(''); setEdit({ orig: t.name, name: t.name, c1: t.c1, c2: t.c2, gcolor: t.gcolor || '' }); }} className="flex flex-1 items-center gap-3 rounded-2xl glass-soft px-3 py-2.5 text-right hover:bg-[var(--glass-2)]">
        <span className="rounded-full px-3 py-1 text-sm font-semibold text-white" style=${{ background: `linear-gradient(90deg,${t.c1},${t.c2})` }}>${t.name}</span>
        <span className="flex-1 text-xs text-muted">${count(t.name)} אירועים</span>
        <span className="flex items-center gap-1 text-[11px] text-muted" title="הצבע ביומן גוגל"><span className="h-3 w-3 rounded-full" style=${{ background: gHex(t.gcolor || autoGColor(t.c1, t.c2)) }}></span>גוגל</span>
        <span className="text-sm text-muted">עריכה</span>
      </button>
    </li>`)}</ul>
    <${Btn} kind="grad" className="mt-3" onClick=${() => { const sw = SWATCHES[types.length % SWATCHES.length]; setEdit({ orig: null, name: '', c1: sw[0], c2: sw[1], gcolor: '' }); }}>+ קטגוריה חדשה<//>
    ${edit && html`<${Modal} title=${edit.orig == null ? 'קטגוריה חדשה' : 'עריכת קטגוריה'} onClose=${() => setEdit(null)}>
      <div className="space-y-4">
        <div className="text-center"><span className="inline-block rounded-full px-5 py-2 text-lg font-bold text-white" style=${{ background: `linear-gradient(90deg,${edit.c1},${edit.c2})` }}>${edit.name || 'שם הקטגוריה'}</span></div>
        <${Label} text="שם"><input className="field" value=${edit.name} onChange=${e => setEdit(Object.assign({}, edit, { name: e.target.value }))} placeholder="למשל: בר מצווה" /><//>
        <div>
          <span className="mb-2 block text-xs font-semibold text-muted">צבעים מוכנים</span>
          <div className="flex flex-wrap gap-2">${SWATCHES.map(sw => html`<button key=${sw.join()} aria-label="בחר צבע" onClick=${() => setEdit(Object.assign({}, edit, { c1: sw[0], c2: sw[1] }))}
            className=${'h-9 w-9 rounded-full ' + (edit.c1 === sw[0] && edit.c2 === sw[1] ? 'ring-2 ring-offset-2 ring-offset-transparent ring-[var(--ink)]' : '')} style=${{ background: `linear-gradient(135deg,${sw[0]},${sw[1]})` }}></button>`)}</div>
        </div>
        <div className="grid grid-cols-2 gap-2">
          <${ColorField} label="צבע התחלה" value=${edit.c1} onChange=${v => setEdit(Object.assign({}, edit, { c1: v }))} />
          <${ColorField} label="צבע סיום" value=${edit.c2} onChange=${v => setEdit(Object.assign({}, edit, { c2: v }))} />
        </div>
        <div>
          <span className="mb-2 block text-xs font-semibold text-muted">צבע ביומן גוגל · ${(GCOLORS.find(g => g.id === (edit.gcolor || autoGColor(edit.c1, edit.c2))) || {}).name}${edit.gcolor ? '' : ' (אוטומטי, הכי קרוב)'}</span>
          <div className="flex flex-wrap items-center gap-2">
            <button type="button" onClick=${() => setEdit(Object.assign({}, edit, { gcolor: '' }))} aria-pressed=${!edit.gcolor}
              className=${'rounded-full px-3 py-1.5 text-xs font-semibold ' + (!edit.gcolor ? 'grad' : 'glass-soft text-muted')}>אוטומטי</button>
            ${GCOLORS.map(g => html`<button type="button" key=${g.id} aria-label=${g.name} title=${g.name} onClick=${() => setEdit(Object.assign({}, edit, { gcolor: g.id }))}
              className=${'h-8 w-8 rounded-full ' + (edit.gcolor === g.id ? 'ring-2 ring-offset-2 ring-offset-transparent ring-[var(--ink)]' : '')} style=${{ background: g.hex }}></button>`)}
          </div>
          <p className="mt-1.5 text-xs text-muted">ביומן גוגל יש 11 צבעים קבועים, אז נבחר הצבע הכי קרוב. אפשר לבחור ידנית.</p>
        </div>
        ${edit.orig != null && count(edit.orig) > 0 && types.length > 1 && html`<${Label} text="אם מסירים — להעביר את האירועים ל:">
          <select className="field" value=${moveTo} onChange=${e => setMoveTo(e.target.value)}>${types.filter(t => t.name !== edit.orig).map(t => html`<option key=${t.name}>${t.name}</option>`)}</select><//>`}
        <div className="flex gap-2 pt-1">
          <${Btn} kind="grad" disabled=${!edit.name.trim()} onClick=${save}>שמירה<//>
          <${Btn} onClick=${() => setEdit(null)}>ביטול<//>
          <span className="flex-1"></span>
          ${edit.orig != null && types.length > 1 && html`<${Btn} kind="danger" onClick=${del}>הסרה<//>`}
        </div>
      </div>
    <//>`}
  </div>`;
}

/* ===== כניסת ניהול ===== */
function AdminLogin({ adminData, mode, onSuccess, onSetPassword, onClose }) {
  // mode: 'setup' | 'login' | 'change'
  const [cur, setCur] = useState(''), [pw, setPw] = useState(''), [pw2, setPw2] = useState('');
  const [remember, setRemember] = useState(!IS_DESKTOP), [err, setErr] = useState(''), [busy, setBusy] = useState(false), [show, setShow] = useState(false);
  const title = mode === 'setup' ? 'יצירת סיסמת ניהול' : mode === 'change' ? 'שינוי סיסמת ניהול' : 'כניסה לניהול';
  const keys = (adminData && adminData.passkeys) || [];
  const faceLogin = async auto => { setErr(''); try { await passkeyCheck(keys); onSuccess(adminData.hash, remember); } catch (e) { if (auto !== true) setErr(passkeyErr(e)); } };

  const submit = async e => {
    e.preventDefault(); setErr('');
    if (!(window.crypto && crypto.subtle)) { setErr('הדפדפן הזה לא תומך בהצפנת הסיסמה'); return; }
    setBusy(true);
    try {
      if (mode === 'login' || mode === 'change') {
        const h = await hashPw(mode === 'login' ? pw : cur, adminData.salt);
        if (h !== adminData.hash) { setErr(mode === 'login' ? 'סיסמה שגויה' : 'הסיסמה הנוכחית שגויה'); setBusy(false); return; }
        if (mode === 'login') { onSuccess(adminData.hash, remember); return; }
      }
      if (pw.length < 4) { setErr('הסיסמה צריכה להיות לפחות 4 תווים'); setBusy(false); return; }
      if (pw !== pw2) { setErr('הסיסמאות לא תואמות'); setBusy(false); return; }
      const salt = uid(); const hash = await hashPw(pw, salt);
      onSetPassword({ salt, hash, set: Date.now() }, remember);
    } catch (x) { setErr('משהו השתבש, נסה שוב'); setBusy(false); }
  };
  const pwField = (label, v, set, auto) => html`<${Label} text=${label}><input type=${show ? 'text' : 'password'} className="field ltr text-right" value=${v} onChange=${e => set(e.target.value)} autoComplete=${auto} /><//>`;
  return html`
    <${Modal} title=${title} onClose=${onClose}>
      <form onSubmit=${submit} className="space-y-3">
        <div className="text-center text-5xl" aria-hidden="true">${mode === 'login' ? '🔒' : '🔐'}</div>
        ${mode === 'setup' && html`<p className="text-sm text-muted">בחר סיסמה. רק מי שיודע אותה יוכל לראות כספים, להוסיף ולערוך אירועים ולשנות הגדרות.</p>`}
        ${mode === 'change' && pwField('סיסמה נוכחית', cur, setCur, 'current-password')}
        ${mode === 'login' ? pwField('סיסמה', pw, setPw, 'current-password') : html`${pwField(mode === 'change' ? 'סיסמה חדשה' : 'סיסמה', pw, setPw, 'new-password')}${pwField('אימות סיסמה', pw2, setPw2, 'new-password')}`}
        <label className="flex items-center gap-2 text-sm"><input type="checkbox" className="h-4 w-4 accent-fuchsia-500" checked=${show} onChange=${e => setShow(e.target.checked)} /> הצג סיסמה</label>
        ${mode !== 'change' && IS_DESKTOP && html`<p className="text-xs text-muted">🖥️ במחשב תתבקש סיסמה בכל פעם שפותחים את האפליקציה.</p>`}
        ${mode !== 'change' && !IS_DESKTOP && html`<label className="flex items-center gap-2 text-sm"><input type="checkbox" className="h-4 w-4 accent-fuchsia-500" checked=${remember} onChange=${e => setRemember(e.target.checked)} /> זכור אותי ל־30 יום (בכל המכשירים שלי)</label>`}

        ${err && html`<p role="alert" className="rounded-2xl glass-soft px-3 py-2 text-sm text-bad">${err}</p>`}
        <div className="flex gap-2 pt-1">
          <${Btn} kind="grad" type="submit" disabled=${busy}>${mode === 'login' ? 'כניסה' : 'שמירת סיסמה'}<//>
          <${Btn} type="button" onClick=${onClose}>ביטול<//>
        </div>
      </form>
    <//>`;
}

function Compare({ gigs }) {
  const [show, setShow] = useState(false);
  if (!show) return html`<button onClick=${() => setShow(true)} className="flex w-full items-center gap-2 rounded-2xl glass-soft px-4 py-2.5 text-right text-sm text-muted hover:bg-[var(--glass-2)]"><span aria-hidden="true">📊</span><span className="flex-1">השוואת תקופות</span><span>▾</span></button>`;
  return html`<${CompareBody} gigs=${gigs} onClose=${() => setShow(false)} />`;
}
function CompareBody({ gigs, onClose }) {
  const now = new Date(), years = Array.from(new Set(gigs.map(g => +g.date.slice(0, 4)).concat([now.getFullYear()]))).sort();
  const [unit, setUnit] = useState('month');
  const [A, setA] = useState({ y: now.getFullYear(), m: now.getMonth() + 1 });
  const [B, setB] = useState({ y: now.getFullYear() - 1, m: now.getMonth() + 1 });
  const inP = P => g => unit === 'year' ? g.date.slice(0, 4) === String(P.y) : g.date.slice(0, 7) === P.y + '-' + pad(P.m);
  const label = P => unit === 'year' ? String(P.y) : new Date(P.y, P.m - 1, 1).toLocaleDateString('he-IL', { month: 'long', year: 'numeric' });
  const stats = P => { const l = gigs.filter(inP(P)), paid = l.filter(g => g.paidDate && Number(g.fee) > 0), open = l.filter(g => Number(g.fee) > 0 && !g.paidDate), sum = x => x.reduce((a, g) => a + amt(g), 0);
    return { l, paid, open, total: sum(l), paidSum: sum(paid), openSum: sum(open), avg: l.filter(g => Number(g.fee) > 0).length ? sum(l) / l.filter(g => Number(g.fee) > 0).length : 0 }; };
  const a = stats(A), b = stats(B);
  const diff = (x, y) => !y ? (x ? html`<span className="text-muted">חדש</span>` : '—') : x === y ? '—' : html`<span className="text-muted">${x > y ? '+' : '−'}${Math.abs(Math.round((x - y) / y * 100))}%</span>`;
  const sel = (P, set) => html`<div className="flex gap-1.5">
    ${unit === 'month' && html`<select aria-label="חודש" className="field py-1.5 text-sm" value=${P.m} onChange=${e => set(Object.assign({}, P, { m: +e.target.value }))}>${Array.from({ length: 12 }, (_, i) => html`<option key=${i} value=${i + 1}>${new Date(2026, i, 1).toLocaleDateString('he-IL', { month: 'long' })}</option>`)}</select>`}
    <select aria-label="שנה" className="field w-24 py-1.5 text-sm" value=${P.y} onChange=${e => set(Object.assign({}, P, { y: +e.target.value }))}>${years.map(y => html`<option key=${y} value=${y}>${y}</option>`)}</select></div>`;
  const cell = (v, list, P, what) => html`<button onClick=${() => drill(what + ' · ' + label(P), list, { sort: 'date' })} className="w-full rounded-lg px-1 py-1 text-center font-bold hover:bg-[var(--glass)]">${v}</button>`;
  const row = (name, fa, fb, la, lb, raw, inv) => html`<tr className="border-t border-[var(--glass-line)]"><td className="py-2 text-sm text-muted">${name}</td><td>${cell(fa, la, A, name)}</td><td>${cell(fb, lb, B, name)}</td><td className="text-center text-xs font-bold">${diff(raw[0], raw[1], inv)}</td></tr>`;
  const typesUsed = TYPES.filter(t => a.l.some(g => g.type === t.id) || b.l.some(g => g.type === t.id));
  return html`<${Panel} className="p-4 sm:p-5">
    <div className="flex flex-wrap items-center gap-2">
      <h3 className="flex-1 text-lg font-bold">📊 השוואת תקופות</h3>
      <button onClick=${onClose} className="rounded-full glass-soft px-3 py-1 text-xs font-semibold text-muted">סגירה ▴</button>
      <div className="flex gap-1 rounded-full glass-soft p-1 text-xs font-semibold" role="radiogroup" aria-label="יחידה">
        ${[['month', 'חודש'], ['year', 'שנה']].map(([k, l]) => html`<button key=${k} role="radio" aria-checked=${unit === k} onClick=${() => setUnit(k)} className=${'rounded-full px-3 py-1 ' + (unit === k ? 'grad' : 'text-muted')}>${l}</button>`)}
      </div>
    </div>
    <div className="mt-3 grid grid-cols-2 gap-2">${sel(A, setA)}${sel(B, setB)}</div>
    <div className="scroll-x mt-2"><table className="w-full min-w-[19rem]">
      <thead><tr className="text-xs text-muted"><th className="w-[30%] text-right font-semibold"></th><th className="font-semibold">${label(A)}</th><th className="font-semibold">${label(B)}</th><th className="font-semibold">שינוי</th></tr></thead>
      <tbody>
        ${row('אירועים', a.l.length, b.l.length, a.l, b.l, [a.l.length, b.l.length])}
        ${row('סה״כ הכנסות', money(a.total), money(b.total), a.l, b.l, [a.total, b.total])}
        ${row('שולם', money(a.paidSum), money(b.paidSum), a.paid, b.paid, [a.paidSum, b.paidSum])}
        ${row('טרם שולם', money(a.openSum), money(b.openSum), a.open, b.open, [a.openSum, b.openSum], true)}
        ${row('ממוצע לאירוע', money(a.avg), money(b.avg), a.l, b.l, [a.avg, b.avg])}
        ${typesUsed.map(t => { const la = a.l.filter(g => g.type === t.id), lb = b.l.filter(g => g.type === t.id); return row(t.id, la.length, lb.length, la, lb, [la.length, lb.length]); })}
      </tbody></table></div>
    <p className="mt-2 text-xs text-muted">לפי תאריך האירוע. לחיצה על מספר פותחת את רשימת האירועים.</p>
  <//>`;
}

  const max = Math.max(1, ...months.map(m => m.v));

            ${card('🥁', 'סה״כ אירועים שעברו', past.length, done.length + ' סגורים לגמרי', past, '🥁 כל האירועים שעברו')}
          </div>
        <//>`;
      })()}

      <button onClick=${() => drill('הכנסות ' + yr, yearList, { sort: 'paid', sub: 'כל התשלומים שהתקבלו ב־' + yr })} className="glass flex w-full items-center gap-3 rounded-3xl p-4 text-right hover:bg-[var(--glass-2)]">
